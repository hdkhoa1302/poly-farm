<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151f"><title>Tài Xỉu</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="../shared/games-hub.js"></script><style>
:root{color-scheme:dark;--bg:#10151f;--card:#1b2432;--line:#344258;--gold:#f4c75e;--text:#f6f7fb;--muted:#9ba9bc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#26384b,var(--bg) 65%);color:var(--text);font:16px system-ui,sans-serif;min-height:100vh}.wrap{max-width:520px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));display:grid;gap:16px}.head{display:flex;align-items:center;justify-content:space-between}.head h1{font-size:22px;margin:0}.balance,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.balance{text-align:center;color:var(--muted)}.balance b{color:var(--gold);font-size:24px}.dice{display:flex;justify-content:center;gap:12px;padding:8px}.die{width:76px;height:76px;filter:drop-shadow(0 8px 12px #0007)}.rolling .die{animation:tumble .65s ease-in-out infinite alternate}.rolling .die:nth-child(2){animation-delay:.12s}.rolling .die:nth-child(3){animation-delay:.24s}@keyframes tumble{to{transform:translateY(-12px) rotate(22deg)}}.dots{fill:#17202c}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice,.chip,button{font:inherit;color:var(--text);border:1px solid var(--line);background:#263448;border-radius:12px;padding:12px;cursor:pointer}.choice strong{display:block;font-size:18px}.choice small{color:var(--muted)}.choice.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border-radius:999px;padding:8px 14px}.chip.active{background:var(--gold);color:#201b0d;border-color:var(--gold);font-weight:700}.roll{width:100%;background:var(--gold);color:#201b0d;border:0;font-weight:800;font-size:18px;padding:14px}.roll:disabled{opacity:.5}.status{text-align:center;min-height:24px;color:var(--gold);font-weight:700}.title{margin:0 0 12px;font-size:16px}.hint{color:var(--muted);font-size:13px;margin:10px 0 0}.panel{padding:14px}.rules{color:var(--muted);font-size:13px;line-height:1.6}.gh-row{background:#263448!important}button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}@media(prefers-reduced-motion:reduce){.rolling .die{animation:none}}
</style></head><body><main class="wrap"><header class="head"><h1>Tài Xỉu</h1><span id="player"></span></header><section class="balance" aria-live="polite">Số dư <b id="coins">1,000</b> xu</section><section class="panel"><div class="dice" id="dice" aria-label="Ba xúc xắc"></div><div class="status" id="status" aria-live="polite">Chọn cửa và mức cược</div></section><section class="panel"><h2 class="title">Chọn cửa</h2><div class="choices"><button class="choice active" data-side="tai"><strong>TÀI</strong><small>Tổng 11–17</small></button><button class="choice" data-side="xiu"><strong>XỈU</strong><small>Tổng 4–10</small></button></div><h2 class="title" style="margin-top:18px">Mức cược</h2><div class="chips" id="chips"></div><p class="hint">Thắng: nhận lại gấp đôi tiền cược. Bộ ba tính Xỉu.</p></section><button class="roll" id="roll">LĂN XÚC XẮC</button><section class="panel"><h2 class="title">Bảng xếp hạng · xu thắng</h2><div id="leaderboard"></div></section></main><script>
(function(){'use strict';var sides=['tai','xiu'],bets=[10,50,100,250,500],side='tai',bet=50,coins=1000,best=0,rolling=false,faces=[1,2,3,4,5,6],dice=document.getElementById('dice'),status=document.getElementById('status'),roll=document.getElementById('roll'),lb=GamesHub.leaderboard('tai-xiu');function face(n){var p=[[50,50],[28,28],[72,72],[28,72],[72,28],[28,50],[72,50]],positions=Array.from({length:n},function(_,i){return p[i]});return '<svg class="die" viewBox="0 0 100 100" role="img" aria-label="'+n+'"><rect x="4" y="4" width="92" height="92" rx="19" fill="#fff" stroke="#d7deea" stroke-width="3"/>'+positions.map(function(v){return '<circle class="dots" cx="'+v[0]+'" cy="'+v[1]+'" r="8"/>';}).join('')+'</svg>'}function renderDice(a){dice.innerHTML=a.map(face).join('')}function showCoins(){document.getElementById('coins').textContent=coins.toLocaleString('vi-VN')}renderDice([1,1,1]);document.getElementById('player').textContent=GamesHub.player().name;document.getElementById('chips').innerHTML=bets.map(function(v){return '<button class="chip'+(v===bet?' active':'')+'" data-bet="'+v+'">'+v+'</button>'}).join('');document.querySelectorAll('.choice').forEach(function(el){el.addEventListener('click',function(){side=el.dataset.side;document.querySelectorAll('.choice').forEach(function(x){x.classList.toggle('active',x===el)})})});document.getElementById('chips').addEventListener('click',function(e){var v=Number(e.target.dataset.bet);if(!v)return;bet=v;document.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('active',Number(x.dataset.bet)===v)})});roll.addEventListener('click',function(){if(rolling)return;if(bet>coins){status.textContent='Không đủ xu cho mức cược này';return}rolling=true;coins-=bet;showCoins();roll.disabled=true;dice.classList.add('rolling');status.textContent='Đang lăn…';var result=Array.from({length:3},function(){return 1+Math.floor(Math.random()*6)});window.setTimeout(function(){dice.classList.remove('rolling');renderDice(result);var sum=result.reduce(function(a,b){return a+b},0),isTai=sum>=11&&sum<=17,won=(side==='tai')===isTai;if(won){coins+=bet*2;best+=bet;status.textContent='Thắng! Tổng '+sum+' · +'+bet+' xu';lb.submit(best).then(function(){GamesHub.renderLeaderboard(document.getElementById('leaderboard'),'tai-xiu')})}else status.textContent='Thua! Tổng '+sum+' · thử lại nhé';showCoins();rolling=false;roll.disabled=false},850)});GamesHub.wireBackButton();GamesHub.renderLeaderboard(document.getElementById('leaderboard'),'tai-xiu')})();
</script></body></html>
