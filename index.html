<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>App Hub — Telegram Mini Apps</title>

<!-- Nạp SDK sớm + chốt theme TRƯỚC khi vẽ để không nháy màu -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var inTg = !!(tg && tg.platform && tg.platform !== 'unknown');
  var scheme = inTg
    ? (tg.colorScheme === 'light' ? 'light' : 'dark')
    : (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', scheme);
  window.__inTg = inTg;
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     Tokens — nền tảng Linear: dark mặc định, light tương ứng
     ============================================================ */
  :root{
    --bg:#08090a;
    --surface:#191a1b;
    --surface-hi:#28282c;

    --text:#f7f8f8;
    --body:#d0d6e0;
    --muted:#8a8f98;

    --border:rgba(255,255,255,.13);
    --border-subtle:rgba(255,255,255,.10);
    --border-hair:rgba(255,255,255,.065);

    --row:rgba(255,255,255,.045);
    --row-hover:rgba(255,255,255,.075);
    --row-shadow:none;          /* Linear: nền tối không dùng shadow để tạo elevation */
    --chev-op:.72;

    --accent:#5e6ad2;
    --accent-hi:#828fff;
    --ok:#27a644;

    --mark-shadow:0 0 0 1px rgba(255,255,255,.06), 0 6px 18px rgba(94,106,210,.30);
    --ico-light:62%;          /* độ sáng nền khung icon */
    --ico-alpha:.14;          /* độ đậm nền khung icon */
    --ico-edge:.26;           /* độ đậm viền khung icon */
    --ico-sat:62%;            /* độ bão hoà nét icon */

    --r-md:8px;
    --r-lg:12px;
    --ease:cubic-bezier(.22,.61,.36,1);
  }

  :root[data-theme="light"]{
    --bg:#ffffff;
    --surface:#f2f3f5;
    --surface-hi:#e6e8ea;

    --text:#0b0c0e;
    --body:#3d434b;
    --muted:#5f6675;

    --border:rgba(9,10,12,.16);
    --border-subtle:rgba(9,10,12,.11);
    --border-hair:rgba(9,10,12,.09);

    --row:rgba(9,10,12,.03);
    --row-hover:rgba(9,10,12,.055);
    /* trên nền sáng, thẻ cần elevation thật để không tan vào nền */
    --row-shadow:0 1px 2px rgba(9,10,12,.05);
    --chev-op:.85;

    --accent:#5e6ad2;
    --accent-hi:#4a54c4;
    --ok:#12833a;

    --mark-shadow:0 0 0 1px rgba(9,10,12,.05), 0 6px 16px rgba(94,106,210,.26);
    --ico-light:48%;          /* nền khung icon trên nền sáng */
    --ico-alpha:.11;
    --ico-edge:.22;
    --ico-sat:58%;
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  /* [hidden] phải thắng mọi display do author CSS đặt */
  [hidden]{display:none!important}

  html{-webkit-text-size-adjust:100%}

  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-feature-settings:'cv01','ss03';
    background:var(--bg);
    color:var(--text);
    min-height:100vh;min-height:100dvh;
    display:flex;justify-content:center;
    letter-spacing:-.011em;
    transition:background .22s var(--ease),color .22s var(--ease);
  }

  .shell{
    width:100%;max-width:520px;
    min-height:100vh;min-height:100dvh;
    padding:calc(20px + env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:22px;
  }

  /* .top + .foot cùng margin-top:auto → khối nội dung cân giữa vùng trên, footer neo đáy */
  .foot{margin-top:auto}

  /* ---------------- top bar ---------------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto}

  .brand{display:flex;align-items:center;gap:10px;min-width:0}

  .mark{
    width:32px;height:32px;flex:none;
    border-radius:var(--r-md);
    background:linear-gradient(160deg,var(--accent),#4a52a8);
    display:grid;place-items:center;
    font-size:15px;font-weight:600;color:#fff;letter-spacing:0;
    box-shadow:var(--mark-shadow);
  }
  .mark svg{width:17px;height:17px;display:block;stroke-width:2.2}

  .brand h1{font-size:15px;font-weight:500;letter-spacing:-.02em;line-height:1.2}
  .brand p{font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:1px}

  .you{
    display:flex;align-items:center;gap:7px;
    padding:5px 10px 5px 5px;
    border:1px solid var(--border-subtle);
    background:var(--row);
    border-radius:9999px;
    font-size:12px;font-weight:500;color:var(--body);
    max-width:46%;
  }
  .you img,.you .pip{
    width:20px;height:20px;border-radius:50%;flex:none;object-fit:cover;
    background:var(--surface-hi);
    display:grid;place-items:center;
    font-size:10px;font-weight:600;color:var(--body);
  }
  .you span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------------- section label ---------------- */
  .label-row{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px}
  .overline{
    font-size:10.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);
  }
  .count{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:var(--muted)}

  /* ---------------- app list ---------------- */
  .apps{display:flex;flex-direction:column;gap:8px}

  .app{
    display:flex;align-items:center;gap:13px;width:100%;text-align:left;
    padding:12px;
    background:var(--row);
    border:1px solid var(--border-subtle);
    border-radius:var(--r-lg);
    box-shadow:var(--row-shadow);
    color:inherit;font:inherit;cursor:pointer;
    transition:background .16s var(--ease),border-color .16s var(--ease),transform .16s var(--ease);
    -webkit-appearance:none;appearance:none;
  }
  .app:hover{background:var(--row-hover);border-color:var(--border);transform:translateX(2px)}
  .app:active{transform:translateX(1px) scale(.995)}
  .app:focus-visible{outline:none;box-shadow:0 0 0 2px var(--accent-hi);border-color:transparent}

  /* Icon: khung đồng nhất, mỗi app một sắc thái qua --tint.
     --app-ink / --app-ink-light được TÍNH RIÊNG cho từng hue sao cho
     độ chói cảm nhận bằng nhau (vàng sáng hơn đỏ ở cùng L, nên L phải khác). */
  .ico{
    width:42px;height:42px;flex:none;
    border-radius:11px;
    background:hsl(var(--tint,240) 52% var(--ico-light) / var(--ico-alpha));
    border:1px solid hsl(var(--tint,240) 52% var(--ico-light) / var(--ico-edge));
    display:grid;place-items:center;
    color:hsl(var(--tint,240) var(--ico-sat) var(--app-ink,62%));
    transition:border-color .16s var(--ease),background .16s var(--ease);
  }
  :root[data-theme="light"] .ico{
    color:hsl(var(--tint,240) var(--ico-sat) var(--app-ink-light,42%));
  }
  .ico svg{width:22px;height:22px;display:block;stroke-width:1.9}
  .app:hover .ico{
    border-color:hsl(var(--tint,240) 55% var(--ico-light) / calc(var(--ico-edge) + .18));
    background:hsl(var(--tint,240) 52% var(--ico-light) / calc(var(--ico-alpha) + .05));
  }

  .meta{flex:1;min-width:0}
  .name{display:block;font-size:14.5px;font-weight:500;letter-spacing:-.017em;color:var(--text)}
  .desc{
    font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:2px;
    /* 2 dòng rồi mới cắt — tránh cắt giữa câu như khi nowrap 1 dòng */
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;
  }

  .chev{
    flex:none;color:var(--muted);opacity:var(--chev-op);line-height:1;
    display:flex;align-items:center;
    transition:color .16s var(--ease),opacity .16s var(--ease),transform .16s var(--ease);
  }
  .chev svg{width:16px;height:16px;display:block}
  .app:hover .chev{color:var(--accent-hi);opacity:1;transform:translateX(1px)}

  /* ---------------- empty / footer ---------------- */
  .empty{
    padding:44px 16px;text-align:center;
    border:1px dashed var(--border-subtle);border-radius:var(--r-lg);
    color:var(--muted);font-size:12.5px;line-height:1.6;
  }

  .foot{
    display:flex;align-items:center;gap:7px;
    padding-top:12px;border-top:1px solid var(--border-hair);
  }
  .dot{width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.45;flex:none;transition:background .3s,opacity .3s}
  .dot.on{background:var(--ok);opacity:1}
  .foot span{font-size:11px;color:var(--muted)}

  /* ---------------- motion ---------------- */
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .app,.empty{animation:rise .34s var(--ease) both}
  .app:nth-child(1){animation-delay:.02s}
  .app:nth-child(2){animation-delay:.06s}
  .app:nth-child(3){animation-delay:.10s}
  .app:nth-child(4){animation-delay:.14s}
  .app:nth-child(5){animation-delay:.18s}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<main class="shell">

  <header class="top">
    <div class="brand">
      <div class="mark"><i data-icon="gamepad-2" data-size="17"></i></div>
      <div>
        <h1>App Hub</h1>
        <p>Telegram Mini Apps</p>
      </div>
    </div>
    <div class="you" id="you" hidden></div>
  </header>

  <div class="label-row">
    <span class="overline">Ứng dụng</span>
    <span class="count" id="count"></span>
  </div>

  <div class="apps" id="app-list"></div>

  <div class="empty" id="empty" hidden>
    Chưa có ứng dụng nào.<br>Hãy yêu cầu tạo app mới — nó sẽ tự xuất hiện ở đây.
  </div>

  <footer class="foot">
    <span class="dot" id="dot"></span>
    <span id="status">Đang khởi động…</span>
  </footer>

</main>

<script src="shared/icons.js"></script>
<script src="shared/games-hub.js"></script>
<script>
/* ============================================================
 * App Hub — launcher cho Telegram Mini Apps
 *
 * Thêm app mới: 1 entry vào APPS.
 *   path  — đường dẫn tương đối, mở NGAY trong webview (không cần BotFather)
 *   url   — URL tuyệt đối, fallback khi mở ngoài Telegram
 *   tint  — hue 0-360, cho khung icon một sắc thái riêng
 * ============================================================ */
const APPS = [
  {
    id: 'poly-farm',
    name: 'Poly Farm',
    icon: 'wheat',                     // tên icon trong shared/icons.js (Lucide)
    tint: 108,                         // hue khung icon
    ink: 48, inkLight: 36,            // L tính riêng để độ chói = nhau
    desc: 'Nông trại 2D low-poly: trồng cây, thu hoạch, chăn nuôi',
    path: 'poly-farm/',
    url: 'https://hdkhoa1302.github.io/poly-farm/poly-farm/'
  },
  {
    id: '2048',
    name: '2048',
    icon: 'grid-2x2',
    tint: 34,
    ink: 61, inkLight: 42,
    desc: 'Ghép ô cùng số, đạt 2048 để thắng — có bảng xếp hạng',
    path: '2048/',
    url: 'https://hdkhoa1302.github.io/poly-farm/2048/'
  },
  {
    id: 'dinh-lang-3d',
    name: 'Dẹp Loạn Đình Làng 3D',
    icon: 'castle',
    tint: 352,
    ink: 75, inkLight: 58,
    desc: 'Platformer 3D: đạp đầu quái, ăn nấm, lấy sớ vàng',
    path: 'dinh-lang-3d/',
    url: 'https://hdkhoa1302.github.io/poly-farm/dinh-lang-3d/'
  },
  {
    id: 'so-tay-nhom',
    name: 'Sổ Tay Nhóm',
    icon: 'book-open',
    tint: 232,
    ink: 77, inkLight: 63,
    desc: 'Tóm tắt mỗi 100 tin nhắn nhóm — chỉ thành viên xem',
    path: 'so-tay-nhom/',
    url: 'https://hdkhoa1302.github.io/poly-farm/so-tay-nhom/'
  }
  // {
  //   id: 'tetris',
  //   name: 'Tetris',
  //   icon: 'blocks',        // phải có trong shared/icons.js
  //   tint: 200,
  //   desc: 'Xếp hình cổ điển',
  //   path: 'tetris/',
  //   url: 'https://hdkhoa1302.github.io/poly-farm/tetris/'
  // }
];

/* ---------------- Telegram context ---------------- */
const tg = window.Telegram?.WebApp;
const inTg = !!window.__inTg;

if (inTg) {
  tg.ready();
  tg.expand();
  syncChrome();
}

/* Đồng bộ màu header/background của Telegram với theme đang dùng */
function syncChrome() {
  if (!inTg) return;
  const bg = document.documentElement.getAttribute('data-theme') === 'light' ? '#ffffff' : '#08090a';
  try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (e) {}
}

/* Người dùng đổi theme trong Telegram → đổi ngay, không cần tải lại */
if (inTg && tg.onEvent) {
  tg.onEvent('themeChanged', () => {
    document.documentElement.setAttribute('data-theme', tg.colorScheme === 'light' ? 'light' : 'dark');
    syncChrome();
  });
}

/* ---------------- player chip ---------------- */
(function renderYou() {
  const el = document.getElementById('you');
  if (!inTg || !window.GamesHub) return;
  const p = GamesHub.player();
  if (!p || !p.name) return;
  el.hidden = false;
  el.innerHTML = (p.photo
    ? `<img src="${p.photo}" alt="">`
    : `<span class="pip">${p.name.trim().charAt(0).toUpperCase()}</span>`) + '<span></span>';
  el.querySelector('span:last-child').textContent = p.name;
})();

/* ---------------- render apps ---------------- */
const list = document.getElementById('app-list');
const empty = document.getElementById('empty');
document.getElementById('count').textContent = String(APPS.length);

if (!APPS.length) {
  empty.hidden = false;
  empty.style.animation = 'none';
} else {
  APPS.forEach(app => {
    const btn = document.createElement('button');
    btn.className = 'app';
    btn.type = 'button';
    btn.dataset.id = app.id;
    if (app.tint != null) btn.style.setProperty('--tint', app.tint);
    if (app.ink != null) btn.style.setProperty('--app-ink', app.ink + '%');
    if (app.inkLight != null) btn.style.setProperty('--app-ink-light', app.inkLight + '%');
    btn.innerHTML =
      `<span class="ico"><i data-icon="${app.icon}" data-size="22"></i></span>` +
      `<span class="meta"><span class="name"></span><span class="desc"></span></span>` +
      `<span class="chev"><i data-icon="chevron-right" data-size="16"></i></span>`;
    btn.querySelector('.name').textContent = app.name;
    btn.querySelector('.desc').textContent = app.desc;
    btn.addEventListener('click', () => openApp(app));
    list.appendChild(btn);
  });
  if (window.Icons) Icons.hydrate(list);   // vẽ icon SVG
}

/* ---------------- vé vào app (chỉ thành viên nhóm) ----------------
 * Điều hướng trong webview làm MẤT context Telegram ở trang con, nên trang con
 * không tự biết ai đang mở. Hub thì còn nguyên initData (Telegram ký, không giả
 * được) → hub phát "vé" vào Firestore, trang con đọc vé mới cho xem.
 */
const FS_REST = 'https://firestore.googleapis.com/v1/projects/taichinhcanhan-9fcf2/databases/(default)/documents';
const FS_KEY = 'AIzaSyATvxstwU8NM81b8osYBDwmtcL9zAQfdhk';
const GROUP_ID = '-1001769279835';
const NEEDS_TICKET = { 'so-tay-nhom': 1 };

function newToken() {
  const a = new Uint8Array(16); crypto.getRandomValues(a);
  return Array.from(a, b => b.toString(16).padStart(2, '0')).join('');
}

function me() {
  try { return (inTg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null; } catch (e) { return null; }
}
function myChat() {
  try { return (inTg && tg.initDataUnsafe && tg.initDataUnsafe.chat) || null; } catch (e) { return null; }
}

/* Thành viên nhóm: Telegram nói chat hiện tại đúng là nhóm → khỏi cần duyệt tay. */
function fromGroup() {
  const c = myChat();
  return !!c && String(c.id) === GROUP_ID;
}

/* Danh sách đã được duyệt: games/group-digest-members/scores/tg_<user_id> */
async function approved(uid) {
  if (!uid) return false;
  try {
    const r = await fetch(FS_REST + '/games/group-digest-members/scores/tg_' + encodeURIComponent(uid) + '?key=' + FS_KEY);
    if (!r.ok) return false;
    return !!(await r.json()).fields;
  } catch (e) { return false; }
}

async function mintTicket() {
  const u = me(), c = myChat();
  const uid = u ? String(u.id) : '';
  const allow = fromGroup() || (await approved(uid));
  const token = newToken();
  const now = Math.floor(Date.now() / 1000);
  const fields = {
    appId:    { stringValue: 'group-digest-tickets' },
    playerId: { stringValue: token },
    name:     { stringValue: 'ticket' },
    score:    { integerValue: String(now + 900) },      // hết hạn sau 15 phút
    userId:   { stringValue: uid },
    userName: { stringValue: u ? ([u.first_name, u.last_name].filter(Boolean).join(' ').trim() || u.username || '') : '' },
    chatId:   { stringValue: c ? String(c.id) : '' },
    allow:    { booleanValue: allow },
    ts:       { timestampValue: new Date().toISOString() }
  };
  await fetch(FS_REST + '/games/group-digest-tickets/scores/' + token + '?key=' + FS_KEY,
    { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields }) });
  return token;
}

async function openApp(app) {
  if (inTg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} }
  if (app.path) {
    const base = new URL(app.path, location.href);
    if (NEEDS_TICKET[app.id] && inTg) {
      try {
        const el = document.getElementById('status');
        if (el) el.textContent = 'Đang mở ' + app.name + '…';
        base.searchParams.set('t', await mintTicket());
      } catch (e) { /* không phát được vé → app sẽ báo chờ duyệt */ }
    }
    window.location.href = base.href;
    return;
  }
  if (inTg) tg.openLink(app.url);
  else window.open(app.url, '_blank');
}

/* ---------------- deep link: ?startapp=<appId> mở thẳng 1 app ---------------- */
/* Dùng cho nút trong GROUP: Telegram chặn nút web_app ở group, nên nút group là
   link t.me/<bot>?startapp=<appId> → mở Mini App (hub) rồi tự nhảy vào app. */
(function autoOpenFromStartParam() {
  const sp = (inTg && tg.initDataUnsafe && tg.initDataUnsafe.start_param)
          || new URLSearchParams(location.search).get('startapp');
  if (!sp) return;
  const app = APPS.find(a => a.id === sp);
  if (app) setTimeout(() => openApp(app), 300);
})();

/* ---------------- status ---------------- */
/* chẩn đoán: máy này Telegram truyền cho Hub những gì */
try {
  const ci = (tg && tg.initData) ? tg.initData.length : 0;
  const sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  document.getElementById('status').dataset.diag =
    'plat=' + (tg ? (tg.platform || '?') : 'no-tg') + ' · initData=' + ci + ' · start=' + (sp || '-');
} catch (e) {}
const dot = document.getElementById('dot');
const status = document.getElementById('status');
if (inTg) {
  dot.classList.add('on');
  status.textContent = 'Đang chạy trong Telegram · ' + (status.dataset.diag || '');
} else {
  status.textContent = 'Ngoài Telegram · ' + (status.dataset.diag || '');
}
</script>
</body>
</html>
