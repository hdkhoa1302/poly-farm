<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>App Hub — Telegram Mini Apps</title>

<!-- Nạp SDK sớm + chốt theme TRƯỚC khi vẽ để không nháy màu -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var inTg = !!(tg && tg.platform && tg.platform !== 'unknown');
  var scheme = inTg
    ? (tg.colorScheme === 'light' ? 'light' : 'dark')
    : (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', scheme);
  window.__inTg = inTg;
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     Tokens — nền tảng Linear: dark mặc định, light tương ứng
     ============================================================ */
  :root{
    --bg:#08090a;
    --surface:#191a1b;
    --surface-hi:#28282c;

    --text:#f7f8f8;
    --body:#d0d6e0;
    --muted:#8a8f98;

    --border:rgba(255,255,255,.13);
    --border-subtle:rgba(255,255,255,.10);
    --border-hair:rgba(255,255,255,.065);

    --row:rgba(255,255,255,.045);
    --row-hover:rgba(255,255,255,.075);
    --row-shadow:none;          /* Linear: nền tối không dùng shadow để tạo elevation */
    --chev-op:.72;

    --accent:#5e6ad2;
    --accent-hi:#828fff;
    --ok:#27a644;

    --mark-shadow:0 0 0 1px rgba(255,255,255,.06), 0 6px 18px rgba(94,106,210,.30);
    --ico-light:62%;          /* độ sáng nền khung icon */
    --ico-alpha:.14;          /* độ đậm nền khung icon */
    --ico-edge:.26;           /* độ đậm viền khung icon */
    --ico-sat:62%;            /* độ bão hoà nét icon */

    --r-md:8px;
    --r-lg:12px;
    --ease:cubic-bezier(.22,.61,.36,1);
  }

  :root[data-theme="light"]{
    --bg:#ffffff;
    --surface:#f2f3f5;
    --surface-hi:#e6e8ea;

    --text:#0b0c0e;
    --body:#3d434b;
    --muted:#5f6675;

    --border:rgba(9,10,12,.16);
    --border-subtle:rgba(9,10,12,.11);
    --border-hair:rgba(9,10,12,.09);

    --row:rgba(9,10,12,.03);
    --row-hover:rgba(9,10,12,.055);
    /* trên nền sáng, thẻ cần elevation thật để không tan vào nền */
    --row-shadow:0 1px 2px rgba(9,10,12,.05);
    --chev-op:.85;

    --accent:#5e6ad2;
    --accent-hi:#4a54c4;
    --ok:#12833a;

    --mark-shadow:0 0 0 1px rgba(9,10,12,.05), 0 6px 16px rgba(94,106,210,.26);
    --ico-light:48%;          /* nền khung icon trên nền sáng */
    --ico-alpha:.11;
    --ico-edge:.22;
    --ico-sat:58%;
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  /* [hidden] phải thắng mọi display do author CSS đặt */
  [hidden]{display:none!important}

  html{-webkit-text-size-adjust:100%}

  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-feature-settings:'cv01','ss03';
    background:var(--bg);
    color:var(--text);
    min-height:100vh;min-height:100dvh;
    display:flex;justify-content:center;
    letter-spacing:-.011em;
    transition:background .22s var(--ease),color .22s var(--ease);
  }

  .shell{
    width:100%;max-width:520px;
    min-height:100vh;min-height:100dvh;
    padding:calc(20px + env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:22px;
  }

  /* .top + .foot cùng margin-top:auto → khối nội dung cân giữa vùng trên, footer neo đáy */
  .foot{margin-top:auto}

  /* ---------------- top bar ---------------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto}

  .brand{display:flex;align-items:center;gap:10px;min-width:0}

  .mark{
    width:32px;height:32px;flex:none;
    border-radius:var(--r-md);
    background:linear-gradient(160deg,var(--accent),#4a52a8);
    display:grid;place-items:center;
    font-size:15px;font-weight:600;color:#fff;letter-spacing:0;
    box-shadow:var(--mark-shadow);
  }
  .mark svg{width:17px;height:17px;display:block;stroke-width:2.2}

  .brand h1{font-size:15px;font-weight:500;letter-spacing:-.02em;line-height:1.2}
  .brand p{font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:1px}

  .you{
    display:flex;align-items:center;gap:7px;
    padding:5px 10px 5px 5px;
    border:1px solid var(--border-subtle);
    background:var(--row);
    border-radius:9999px;
    font-size:12px;font-weight:500;color:var(--body);
    max-width:46%;
  }
  .you img,.you .pip{
    width:20px;height:20px;border-radius:50%;flex:none;object-fit:cover;
    background:var(--surface-hi);
    display:grid;place-items:center;
    font-size:10px;font-weight:600;color:var(--body);
  }
  .you span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------------- section label ---------------- */
  .label-row{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px}
  .overline{
    font-size:10.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);
  }
  .count{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:var(--muted)}

  /* ---------------- app list ---------------- */
  .apps{display:flex;flex-direction:column;gap:8px}

  .app{
    display:flex;align-items:center;gap:13px;width:100%;text-align:left;
    padding:12px;
    background:var(--row);
    border:1px solid var(--border-subtle);
    border-radius:var(--r-lg);
    box-shadow:var(--row-shadow);
    color:inherit;font:inherit;cursor:pointer;
    transition:background .16s var(--ease),border-color .16s var(--ease),transform .16s var(--ease);
    -webkit-appearance:none;appearance:none;
  }
  .app:hover{background:var(--row-hover);border-color:var(--border);transform:translateX(2px)}
  .app:active{transform:translateX(1px) scale(.995)}
  .app:focus-visible{outline:none;box-shadow:0 0 0 2px var(--accent-hi);border-color:transparent}

  /* Icon: khung đồng nhất, mỗi app một sắc thái qua --tint.
     --app-ink / --app-ink-light được TÍNH RIÊNG cho từng hue sao cho
     độ chói cảm nhận bằng nhau (vàng sáng hơn đỏ ở cùng L, nên L phải khác). */
  .ico{
    width:42px;height:42px;flex:none;
    border-radius:11px;
    background:hsl(var(--tint,240) 52% var(--ico-light) / var(--ico-alpha));
    border:1px solid hsl(var(--tint,240) 52% var(--ico-light) / var(--ico-edge));
    display:grid;place-items:center;
    color:hsl(var(--tint,240) var(--ico-sat) var(--app-ink,62%));
    transition:border-color .16s var(--ease),background .16s var(--ease);
  }
  :root[data-theme="light"] .ico{
    color:hsl(var(--tint,240) var(--ico-sat) var(--app-ink-light,42%));
  }
  .ico svg{width:22px;height:22px;display:block;stroke-width:1.9}
  .app:hover .ico{
    border-color:hsl(var(--tint,240) 55% var(--ico-light) / calc(var(--ico-edge) + .18));
    background:hsl(var(--tint,240) 52% var(--ico-light) / calc(var(--ico-alpha) + .05));
  }

  .meta{flex:1;min-width:0}
  .name{display:block;font-size:14.5px;font-weight:500;letter-spacing:-.017em;color:var(--text)}
  .desc{
    font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:2px;
    /* 2 dòng rồi mới cắt — tránh cắt giữa câu như khi nowrap 1 dòng */
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;
  }

  .chev{
    flex:none;color:var(--muted);opacity:var(--chev-op);line-height:1;
    display:flex;align-items:center;
    transition:color .16s var(--ease),opacity .16s var(--ease),transform .16s var(--ease);
  }
  .chev svg{width:16px;height:16px;display:block}
  .app:hover .chev{color:var(--accent-hi);opacity:1;transform:translateX(1px)}

  /* ---------------- empty / footer ---------------- */
  .empty{
    padding:44px 16px;text-align:center;
    border:1px dashed var(--border-subtle);border-radius:var(--r-lg);
    color:var(--muted);font-size:12.5px;line-height:1.6;
  }

  .foot{
    display:flex;align-items:center;gap:7px;
    padding-top:12px;border-top:1px solid var(--border-hair);
  }
  .dot{width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.45;flex:none;transition:background .3s,opacity .3s}
  .dot.on{background:var(--ok);opacity:1}
  .foot span{font-size:11px;color:var(--muted)}

  /* ---------------- motion ---------------- */
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .app,.empty{animation:rise .34s var(--ease) both}
  .app:nth-child(1){animation-delay:.02s}
  .app:nth-child(2){animation-delay:.06s}
  .app:nth-child(3){animation-delay:.10s}
  .app:nth-child(4){animation-delay:.14s}
  .app:nth-child(5){animation-delay:.18s}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }

  /* ---------------- quản lý app: ẩn · kéo thả · xoá ---------------- */
  .tools{display:flex;align-items:center;gap:6px;flex:none}
  .tbtn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:8px;
        border:1px solid var(--border-subtle);background:rgba(127,127,127,.07);color:var(--body);
        font:inherit;font-size:11.5px;font-weight:500;cursor:pointer;flex:none;
        transition:background .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease)}
  .tbtn svg{width:14px;height:14px;display:block}
  .tbtn:hover{background:rgba(127,127,127,.14);border-color:var(--border);color:var(--text)}
  .tbtn.on{background:var(--accent);border-color:transparent;color:#fff}
  .chip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:9999px;
        border:1px solid var(--border-subtle);background:rgba(127,127,127,.06);color:var(--muted);
        font:inherit;font-size:11.5px;cursor:pointer;flex:none;
        transition:color .15s var(--ease),border-color .15s var(--ease)}
  .chip svg{width:13px;height:13px;display:block}
  .chip:hover{color:var(--text);border-color:var(--border)}

  /* tay cầm kéo + nút tác vụ: chỉ hiện khi bật chế độ Sửa */
  .drag,.act{display:none;flex:none;place-items:center;padding:0;border-radius:7px}
  body.manage .drag,body.manage .act{display:grid}
  .drag{width:24px;height:28px;color:var(--faint);cursor:grab;touch-action:none}
  .drag svg{width:15px;height:15px;display:block}
  .drag:active{cursor:grabbing;color:var(--body)}
  .act{width:28px;height:28px;border:1px solid var(--border-subtle);background:rgba(127,127,127,.06);color:var(--muted);cursor:pointer}
  .act svg{width:15px;height:15px;display:block}
  .act:hover{color:var(--text);border-color:var(--border);background:rgba(127,127,127,.14)}
  .act.del:hover{color:#ff6b6b;border-color:rgba(255,107,107,.45);background:rgba(255,107,107,.12)}
  /* đang chờ bấm lần 2 để xoá: tô đỏ hẳn cho khỏi nhầm */
  .act.del.arming{color:#fff;background:#e5484d;border-color:#e5484d}

  /* trong chế độ Sửa: không mở app, không nhích sang phải */
  body.manage .app{cursor:default}
  body.manage .app:hover{transform:none}
  body.manage .app:active{transform:none}
  body.manage .app .chev{display:none}
  /* animation `rise` có fill-mode "both" nên trạng thái cuối (opacity:1) sẽ ĐÈ
     lên opacity của app bị ẩn → phải tắt animation cho hàng đang ẩn/kéo */
  .app.hidden-app{opacity:.45;animation:none}
  .app.hidden-app .name{text-decoration:line-through;text-decoration-color:var(--faint)}
  /* hàng đang kéo: RA KHỎI luồng (inline style position:fixed) để các hàng khác
     không dịch → trung điểm đứng yên → không nhảy lên nhảy xuống */
  .app.dragging{position:fixed;z-index:50;border-color:var(--accent-hi);
                background:var(--row-hover);box-shadow:0 18px 40px rgba(0,0,0,.45);
                animation:none;cursor:grabbing;will-change:top}
  .app.dragging .drag{cursor:grabbing;color:var(--accent-hi)}
  /* ô giữ chỗ: chiếm đúng chỗ cũ để danh sách không co lại */
  .ph{flex:none;border-radius:var(--r-lg);border:1px dashed var(--border);background:rgba(127,127,127,.05)}
  .no-anim .app{animation:none}
</style>
</head>
<body>
<main class="shell">

  <header class="top">
    <div class="brand">
      <div class="mark"><i data-icon="gamepad-2" data-size="17"></i></div>
      <div>
        <h1>App Hub</h1>
        <p>Telegram Mini Apps</p>
      </div>
    </div>
    <div class="you" id="you" hidden></div>
  </header>

  <div class="label-row">
    <span class="overline">Ứng dụng</span>
    <div class="tools">
      <span class="count" id="count"></span>
      <button class="chip" id="showAll" type="button" hidden>
        <i data-icon="eye" data-size="13"></i><span id="showAllLabel"></span>
      </button>
      <button class="tbtn" id="manage" type="button">
        <i data-icon="sliders-horizontal" data-size="14"></i><span id="manageLabel">Sửa</span>
      </button>
    </div>
  </div>

  <div class="apps" id="app-list"></div>

  <div class="empty" id="empty" hidden>
    Chưa có ứng dụng nào.<br>Hãy yêu cầu tạo app mới — nó sẽ tự xuất hiện ở đây.
  </div>

  <footer class="foot">
    <span class="dot" id="dot"></span>
    <span id="status">Đang khởi động…</span>
  </footer>

</main>

<script src="shared/icons.js"></script>
<script src="shared/games-hub.js"></script>
<script>
/* ============================================================
 * App Hub — launcher cho Telegram Mini Apps
 *
 * Thêm app mới: 1 entry vào APPS.
 *   path  — đường dẫn tương đối, mở NGAY trong webview (không cần BotFather)
 *   url   — URL tuyệt đối, fallback khi mở ngoài Telegram
 *   tint  — hue 0-360, cho khung icon một sắc thái riêng
 * ============================================================ */
const APPS = [
  {
    id: 'poly-farm',
    name: 'Poly Farm',
    icon: 'wheat',                     // tên icon trong shared/icons.js (Lucide)
    tint: 108,                         // hue khung icon
    ink: 48, inkLight: 36,            // L tính riêng để độ chói = nhau
    desc: 'Nông trại 2D low-poly: trồng cây, thu hoạch, chăn nuôi',
    path: 'poly-farm/',
    url: 'https://hdkhoa1302.github.io/poly-farm/poly-farm/'
  },
  {
    id: '2048',
    name: '2048',
    icon: 'grid-2x2',
    tint: 34,
    ink: 61, inkLight: 42,
    desc: 'Ghép ô cùng số, đạt 2048 để thắng — có bảng xếp hạng',
    path: '2048/',
    url: 'https://hdkhoa1302.github.io/poly-farm/2048/'
  },
  {
    id: 'dinh-lang-3d',
    name: 'Dẹp Loạn Đình Làng 3D',
    icon: 'castle',
    tint: 352,
    ink: 75, inkLight: 58,
    desc: 'Platformer 3D: đạp đầu quái, ăn nấm, lấy sớ vàng',
    path: 'dinh-lang-3d/',
    url: 'https://hdkhoa1302.github.io/poly-farm/dinh-lang-3d/'
  },
  {
    id: 'so-tay-nhom',
    name: 'Sổ Tay Nhóm',
    icon: 'book-open',
    tint: 232,
    ink: 77, inkLight: 63,
    desc: 'Tóm tắt mỗi 200 tin nhắn nhóm — chỉ thành viên xem',
    path: 'so-tay-nhom/',
    url: 'https://hdkhoa1302.github.io/poly-farm/so-tay-nhom/'
  }
  // {
  //   id: 'tetris',
  //   name: 'Tetris',
  //   icon: 'blocks',        // phải có trong shared/icons.js
  //   tint: 200,
  //   desc: 'Xếp hình cổ điển',
  //   path: 'tetris/',
  //   url: 'https://hdkhoa1302.github.io/poly-farm/tetris/'
  // }
];

/* ---------------- Telegram context ---------------- */
const tg = window.Telegram?.WebApp;
const inTg = !!window.__inTg;

if (inTg) {
  tg.ready();
  tg.expand();
  syncChrome();
}

/* Đồng bộ màu header/background của Telegram với theme đang dùng */
function syncChrome() {
  if (!inTg) return;
  const bg = document.documentElement.getAttribute('data-theme') === 'light' ? '#ffffff' : '#08090a';
  try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (e) {}
}

/* Người dùng đổi theme trong Telegram → đổi ngay, không cần tải lại */
if (inTg && tg.onEvent) {
  tg.onEvent('themeChanged', () => {
    document.documentElement.setAttribute('data-theme', tg.colorScheme === 'light' ? 'light' : 'dark');
    syncChrome();
  });
}

/* ---------------- player chip ---------------- */
(function renderYou() {
  const el = document.getElementById('you');
  if (!inTg || !window.GamesHub) return;
  const p = GamesHub.player();
  if (!p || !p.name) return;
  el.hidden = false;
  el.innerHTML = (p.photo
    ? `<img src="${p.photo}" alt="">`
    : `<span class="pip">${p.name.trim().charAt(0).toUpperCase()}</span>`) + '<span></span>';
  el.querySelector('span:last-child').textContent = p.name;
})();

/* ---------------- ẩn · thứ tự · xoá app ----------------
 * Ẩn và sắp xếp là chuyện RIÊNG từng máy → để trong localStorage, không cần
 * server, không ảnh hưởng ai. Xoá là chuyện CHUNG → Worker (chỉ chủ sở hữu),
 * Hub đọc danh sách đã xoá rồi tự lọc.
 */
const API = 'https://games-hub-api.hdkhoa1302.workers.dev';
const OWNER_ID = 780469718;            // chỉ user này thấy nút xoá (Worker kiểm lại)
const LS_HIDDEN = 'hub_hidden_v1';
const LS_ORDER = 'hub_order_v1';

const list = document.getElementById('app-list');
const empty = document.getElementById('empty');

const myId = () => (inTg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || null;
const isAdmin = () => myId() === OWNER_ID;
const myInit = () => (inTg && tg.initData) || '';
function setStatus(t) { const s = document.getElementById('status'); if (s) s.textContent = t; }

function lsSet(k) { try { const v = JSON.parse(localStorage.getItem(k) || '[]'); return new Set(Array.isArray(v) ? v : []); } catch (e) { return new Set(); } }
function lsArr(k) { try { const v = JSON.parse(localStorage.getItem(k) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function lsSave(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

let hidden = lsSet(LS_HIDDEN);   // app người dùng tự ẩn (chỉ máy này)
let order = lsArr(LS_ORDER);     // thứ tự người dùng tự kéo (chỉ máy này)
let gone = new Set();            // app chủ sở hữu đã xoá (mọi người)
let manage = false;              // đang ở chế độ Sửa
let showAll = false;             // đang cho hiện cả app bị ẩn
let renderCount = 0;             // để animation chỉ chạy lần vẽ đầu

/* Thứ tự hiệu dụng: theo `order`; app MỚI (chưa có trong order) đẩy lên đầu
   để không bị bỏ sót ở cuối danh sách. */
function orderedApps() {
  const vis = APPS.filter(a => !gone.has(a.id));
  const pos = new Map(order.map((id, i) => [id, i]));
  return vis.map((a, i) => ({ a, i, k: pos.has(a.id) ? pos.get(a.id) : null }))
    .sort((x, y) => {
      if (x.k === null && y.k === null) return x.i - y.i;
      if (x.k === null) return -1;
      if (y.k === null) return 1;
      return x.k - y.k;
    }).map(o => o.a);
}

function render() {
  const apps = orderedApps();
  list.innerHTML = '';

  apps.forEach(app => {
    const isHidden = hidden.has(app.id);
    // chế độ Sửa hiện TẤT CẢ (kể cả đang ẩn) để còn kéo/xếp được hết
    if (isHidden && !showAll && !manage) return;

    const btn = document.createElement('button');
    btn.className = 'app' + (isHidden ? ' hidden-app' : '');
    btn.type = 'button';
    btn.dataset.id = app.id;
    if (app.tint != null) btn.style.setProperty('--tint', app.tint);
    if (app.ink != null) btn.style.setProperty('--app-ink', app.ink + '%');
    if (app.inkLight != null) btn.style.setProperty('--app-ink-light', app.inkLight + '%');

    btn.innerHTML =
      `<span class="drag" title="Kéo để sắp xếp"><i data-icon="grip-vertical" data-size="15"></i></span>` +
      `<span class="ico"><i data-icon="${app.icon}" data-size="22"></i></span>` +
      `<span class="meta"><span class="name"></span><span class="desc"></span></span>` +
      `<span class="act hv" title="${isHidden ? 'Hiện lại' : 'Ẩn app này'}">` +
        `<i data-icon="${isHidden ? 'eye' : 'eye-off'}" data-size="15"></i></span>` +
      (isAdmin() ? `<span class="act del${confirmDel === app.id ? ' arming' : ''}" ` +
        `title="Xoá khỏi Hub — áp dụng cho mọi người">` +
        `<i data-icon="trash-2" data-size="15"></i></span>` : '') +
      `<span class="chev"><i data-icon="chevron-right" data-size="16"></i></span>`;

    btn.querySelector('.name').textContent = app.name;
    btn.querySelector('.desc').textContent = app.desc;

    btn.addEventListener('click', (e) => {
      if (!manage) { openApp(app); return; }                  // chế độ thường: mở app
      if (e.target.closest('.act.hv')) { toggleHide(app.id); return; }
      if (e.target.closest('.act.del')) { askDelete(app); return; }
    });
    list.appendChild(btn);
  });

  if (window.Icons) Icons.hydrate(list);
  // animation `rise` chỉ nên chạy ở lần vẽ ĐẦU; nếu không, mỗi lần ẩn/hiện một
  // app là cả danh sách nhấp nháy lại
  if (++renderCount > 1) list.classList.add('no-anim');

  const nHidden = APPS.filter(a => hidden.has(a.id) && !gone.has(a.id)).length;
  document.getElementById('count').textContent = String(apps.length);
  empty.hidden = apps.length > 0;
  if (!apps.length) empty.style.animation = 'none';

  const chip = document.getElementById('showAll');
  chip.hidden = !(nHidden > 0) || manage;
  document.getElementById('showAllLabel').textContent =
    showAll ? 'Ẩn bớt' : ('Hiện tất cả (' + nHidden + ')');
  chip.querySelector('i').setAttribute('data-icon', showAll ? 'eye-off' : 'eye');

  const mb = document.getElementById('manage');
  mb.classList.toggle('on', manage);
  document.getElementById('manageLabel').textContent = manage ? 'Xong' : 'Sửa';
  mb.querySelector('i').setAttribute('data-icon', manage ? 'check' : 'sliders-horizontal');

  document.body.classList.toggle('manage', manage);
  if (window.Icons) { Icons.hydrate(chip); Icons.hydrate(mb); }
}

/* ---------------- ẩn / hiện ---------------- */
function toggleHide(id) {
  if (hidden.has(id)) hidden.delete(id); else hidden.add(id);
  lsSave(LS_HIDDEN, [...hidden]);
  if (inTg && tg.HapticFeedback) { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} }
  render();
}

/* ---------------- xoá (chỉ chủ sở hữu) ----------------
 * Xác nhận bằng 2 bước NGAY TRONG APP, không dùng confirm(): webview Telegram
 * không đảm bảo có hộp thoại native, nên confirm() có thể bị bỏ qua — nghĩa là
 * một cú chạm là xoá app của mọi người, không có bước chặn nào.
 */
let confirmDel = null;      // id đang chờ bấm lần 2
let confirmTimer = null;

function askDelete(app) {
  if (confirmDel === app.id) { confirmDel = null; clearTimeout(confirmTimer); wipeApp(app); return; }
  confirmDel = app.id;
  render();
  setStatus('Bấm thùng rác lần nữa để xoá "' + app.name + '" khỏi Hub cho MỌI người.');
  clearTimeout(confirmTimer);
  confirmTimer = setTimeout(() => {
    if (confirmDel === app.id) { confirmDel = null; render(); setStatus(''); }
  }, 5000);
}

async function wipeApp(app) {
  try {
    const r = await fetch(API + '/apps/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: myInit(), id: app.id })
    });
    if (!r.ok) {
      setStatus(r.status === 403 ? 'Không xoá được — chỉ chủ sở hữu.' : 'Không xoá được (lỗi ' + r.status + ').');
      return;
    }
    gone.add(app.id);
  } catch (e) {
    setStatus('Không xoá được — mạng lỗi.');
    return;
  }
  setStatus('Đã xoá "' + app.name + '" khỏi Hub.');
  render();
}

async function loadDeleted() {
  try {
    const r = await fetch(API + '/apps');
    if (r.ok) gone = new Set((await r.json()).deleted || []);
  } catch (e) { /* offline: dùng danh sách mặc định */ }
  render();
}

/* ---------------- kéo thả sắp xếp ----------------
 * Pointer Events để chạy cả cảm ứng lẫn chuột.
 *
 * ĐIỂM MẤU CHỐT: hàng đang kéo phải được ĐƯA RA KHỎI LUỒNG LAYOUT (position:fixed)
 * và để lại một ô giữ chỗ (placeholder). Nếu hàng vẫn chiếm chỗ trong luồng thì
 * mỗi lần chèn lại, các hàng khác dịch đúng một hàng → trung điểm đổi → lần di
 * chuyển sau lại chèn ngược lại → hàng nhảy lên nhảy xuống liên tục.
 * Ô giữ chỗ thì không ảnh hưởng gì tới các hàng khác, nên trung điểm đứng yên.
 */
let dragState = null;

list.addEventListener('pointerdown', (e) => {
  if (!manage) return;
  const handle = e.target.closest('.drag');
  if (!handle) return;
  const row = handle.closest('.app');
  if (!row || dragState) return;
  e.preventDefault();

  const r = row.getBoundingClientRect();

  // ô giữ chỗ: giữ đúng chỗ trong luồng để danh sách không co lại
  const ph = document.createElement('div');
  ph.className = 'ph';
  ph.style.height = r.height + 'px';
  list.insertBefore(ph, row);

  // hàng ra khỏi luồng, toạ độ theo viewport
  row.classList.add('dragging');
  row.style.position = 'fixed';
  row.style.left = r.left + 'px';
  row.style.top = r.top + 'px';
  row.style.width = r.width + 'px';
  row.style.height = r.height + 'px';
  row.style.pointerEvents = 'none';

  dragState = {
    row, ph, pid: e.pointerId,
    grab: e.clientY - r.top,      // điểm nắm trong hàng
    h: r.height,
  };
  if (inTg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred('light'); } catch (err) {} }
  try { handle.setPointerCapture(e.pointerId); } catch (err) {}
});

list.addEventListener('pointermove', (e) => {
  if (!dragState || e.pointerId !== dragState.pid) return;
  e.preventDefault();
  const { row, ph, grab, h } = dragState;

  const top = e.clientY - grab;             // top mong muốn (viewport)
  row.style.top = top + 'px';

  // tâm hàng đang kéo so với tâm các hàng KHÁC (chúng không đổi vì hàng kia
  // đã ra khỏi luồng) → quyết định chèn ô giữ chỗ vào đâu
  const center = top + h / 2;
  const others = [...list.querySelectorAll('.app')].filter(r => r !== row);
  let target = null;
  for (const r of others) {
    const b = r.getBoundingClientRect();
    if (center < b.top + b.height / 2) { target = r; break; }
  }
  if (ph.nextElementSibling !== target) list.insertBefore(ph, target);

  // tự cuộn khi kéo tới sát mép màn hình
  const pad = 64;
  if (e.clientY < pad) window.scrollBy(0, -12);
  else if (e.clientY > window.innerHeight - pad) window.scrollBy(0, 12);
});

function endDrag(e) {
  if (!dragState) return;
  if (e && e.pointerId !== undefined && e.pointerId !== dragState.pid) return;
  const { row, ph } = dragState;

  // đặt hàng về đúng chỗ ô giữ chỗ rồi trả lại luồng bình thường
  list.insertBefore(row, ph);
  ph.remove();
  row.classList.remove('dragging');
  row.style.position = row.style.left = row.style.top = '';
  row.style.width = row.style.height = row.style.pointerEvents = '';
  dragState = null;

  // lưu đúng thứ tự đang thấy; app không nằm trong danh sách (đang ẩn/đã xoá)
  // giữ nguyên phía sau để không mất chỗ
  const seen = [...list.querySelectorAll('.app')].map(r => r.dataset.id);
  order = seen.concat(APPS.map(a => a.id).filter(id => !seen.includes(id)));
  lsSave(LS_ORDER, order);
  render();
}
list.addEventListener('pointerup', endDrag);
list.addEventListener('pointercancel', endDrag);

document.getElementById('showAll').addEventListener('click', () => { showAll = !showAll; render(); });
document.getElementById('manage').addEventListener('click', () => {
  manage = !manage; showAll = false;
  if (inTg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} }
  render();
});

render();
loadDeleted();

/* ---------------- mở app ---------------- */
/* Khi nhảy sang trang con trong cùng webview, URL mất phần hash launch params
 * nên `tg.initData` rỗng ở trang con. Cách chuẩn: gắn lại launch params vào hash
 * đúng như Telegram vẫn làm — telegram-web-app.js ở trang con sẽ tự dựng lại
 * initData từ đó. Trang con (Sổ Tay Nhóm) nhờ thế tự xác minh được với Worker,
 * không cần "vé" trung gian, không cần Firestore, không cần API key.
 */
function launchHash() {
  if (!inTg || !tg.initData) return '';
  const p = new URLSearchParams();
  p.set('tgWebAppData', tg.initData);
  p.set('tgWebAppVersion', tg.version || '7.0');
  p.set('tgWebAppPlatform', tg.platform || 'web');
  try { if (tg.themeParams) p.set('tgWebAppThemeParams', JSON.stringify(tg.themeParams)); } catch (e) {}
  return p.toString();
}

async function openApp(app) {
  if (inTg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} }
  if (app.path) {
    const base = new URL(app.path, location.href);
    const h = launchHash();
    window.location.href = h ? base.href.split('#')[0] + '#' + h : base.href;
    return;
  }
  if (inTg) tg.openLink(app.url);
  else window.open(app.url, '_blank');
}

/* ---------------- deep link: ?startapp=<appId> mở thẳng 1 app ---------------- */
/* Dùng cho nút trong GROUP: Telegram chặn nút web_app ở group, nên nút group là
   link t.me/<bot>?startapp=<appId> → mở Mini App (hub) rồi tự nhảy vào app. */
(function autoOpenFromStartParam() {
  const sp = (inTg && tg.initDataUnsafe && tg.initDataUnsafe.start_param)
          || new URLSearchParams(location.search).get('startapp');
  if (!sp) return;
  const app = orderedApps().find(a => a.id === sp);   // bỏ qua app đã bị xoá
  if (app) setTimeout(() => openApp(app), 300);
})();

/* ---------------- status ---------------- */
/* chẩn đoán: máy này Telegram truyền cho Hub những gì */
try {
  const ci = (tg && tg.initData) ? tg.initData.length : 0;
  const sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  document.getElementById('status').dataset.diag =
    'plat=' + (tg ? (tg.platform || '?') : 'no-tg') + ' · initData=' + ci + ' · start=' + (sp || '-');
} catch (e) {}
const dot = document.getElementById('dot');
const status = document.getElementById('status');
if (inTg) {
  dot.classList.add('on');
  status.textContent = 'Đang chạy trong Telegram · ' + (status.dataset.diag || '');
} else {
  status.textContent = 'Ngoài Telegram · ' + (status.dataset.diag || '');
}
</script>
