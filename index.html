<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 App Hub - Telegram Mini Apps</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff; min-height: 100vh; padding: 24px 16px;
  }
  .container { max-width: 480px; margin: 0 auto; }
  h1 { text-align: center; font-size: 26px; margin-bottom: 6px; }
  .subtitle { text-align: center; color: #aaa; font-size: 14px; margin-bottom: 24px; }
  .app-card {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px; padding: 16px; margin-bottom: 14px;
    display: flex; align-items: center; gap: 14px;
    backdrop-filter: blur(8px); transition: transform .15s, background .15s;
  }
  .app-card:hover { transform: translateY(-2px); background: rgba(255,255,255,0.12); }
  .app-icon { font-size: 40px; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); border-radius: 12px; }
  .app-info { flex: 1; }
  .app-name { font-size: 17px; font-weight: 600; margin-bottom: 2px; }
  .app-desc { font-size: 13px; color: #bbb; }
  .play-btn {
    background: linear-gradient(135deg, #0088cc, #0066aa);
    color: #fff; border: none; padding: 10px 18px; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
    transition: transform .15s, box-shadow .15s;
  }
  .play-btn:hover { transform: scale(1.05); box-shadow: 0 4px 12px rgba(0,136,204,0.4); }
  .empty { text-align: center; color: #888; padding: 40px 0; font-size: 14px; }
  .footer { text-align: center; color: #666; font-size: 12px; margin-top: 30px; }
  .status { text-align: center; font-size: 12px; color: #81c784; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="container">
  <h1>🎮 App Hub</h1>
  <p class="subtitle">Chọn ứng dụng để mở trong Telegram</p>
  <div class="status" id="status"></div>
  <div id="app-list"></div>
  <div class="empty" id="empty" style="display:none;">Chưa có app nào. Hãy yêu cầu tạo app mới!</div>
  <div class="footer">Powered by GitHub Pages + Telegram Mini Apps</div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
// ===== CẤU HÌNH =====
// Thay bằng username bot của bạn (không có @)
const BOT_USERNAME = 'YOUR_BOT_USERNAME';

// ===== DANH SÁCH APP =====
// Khi thêm app mới, thêm entry vào đây
const APPS = [
  {
    id: 'poly-farm',
    name: 'Poly Farm',
    icon: '🌾',
    desc: 'Game nông trại 2D low-poly: trồng cây, thu hoạch, chăm sóc động vật',
    shortName: 'polyfarm',
    url: 'https://hdkhoa1302.github.io/poly-farm/poly-farm/'
  }
  // Thêm app mới ở đây:
  // {
  //   id: 'tetris',
  //   name: 'Tetris',
  //   icon: '🧱',
  //   desc: 'Game xếp hình cổ điển',
  //   shortName: 'tetris',
  //   url: 'https://hdkhoa1302.github.io/poly-farm/tetris/'
  // }
];

// ===== RENDER =====
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  document.getElementById('status').textContent = '✅ Đang chạy trong Telegram';
} else {
  document.getElementById('status').textContent = '🌐 Đang chạy trên trình duyệt';
}

const list = document.getElementById('app-list');
const empty = document.getElementById('empty');

if (APPS.length === 0) {
  empty.style.display = 'block';
} else {
  APPS.forEach(app => {
    const card = document.createElement('div');
    card.className = 'app-card';
    card.innerHTML = `
      <div class="app-icon">${app.icon}</div>
      <div class="app-info">
        <div class="app-name">${app.name}</div>
        <div class="app-desc">${app.desc}</div>
      </div>
      <button class="play-btn" data-id="${app.id}">▶ Chơi</button>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll('.play-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const app = APPS.find(a => a.id === btn.dataset.id);
      openApp(app);
    });
  });
}

function openApp(app) {
  if (BOT_USERNAME === 'YOUR_BOT_USERNAME') {
    // Chưa cấu hình bot → mở URL trực tiếp
    if (tg) tg.openLink(app.url);
    else window.open(app.url, '_blank');
    return;
  }
  const miniAppUrl = `https://t.me/${BOT_USERNAME}/${app.shortName}`;
  if (tg) {
    tg.openTelegramLink(miniAppUrl);
  } else {
    window.open(miniAppUrl, '_blank');
  }
}
</script>
</body>
</html>
