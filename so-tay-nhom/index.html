<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ Tay Nhóm</title>
<link rel="preconnect" href="https://telegram.org" crossorigin>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../shared/icons.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090a; --panel:#0f1011; --surface:#191a1b; --surface-hi:#28282c;
    --text:#f7f8f8; --body:#d0d6e0; --muted:#8a8f98; --faint:#62666d;
    --border:rgba(255,255,255,.08); --border-subtle:rgba(255,255,255,.05); --border-hair:rgba(255,255,255,.04);
    --accent:#5e6ad2; --accent-hi:#828fff; --ok:#27a644; --warn:#e5a00d;
    --r-md:8px; --r-lg:12px; --ease:cubic-bezier(.22,.61,.36,1);
  }
  html[data-theme="light"]{
    --bg:#ffffff; --panel:#fafafa; --surface:#f4f4f5; --surface-hi:#e8e8ea;
    --text:#08090a; --body:#3c4149; --muted:#5f6675; --faint:#8a8f98;
    --border:rgba(0,0,0,.12); --border-subtle:rgba(0,0,0,.08); --border-hair:rgba(0,0,0,.055);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-feature-settings:'cv01','ss03';
    background:var(--bg); color:var(--text);
    min-height:100dvh; display:flex; justify-content:center;
    letter-spacing:-.011em;
  }
  .shell{width:100%;max-width:560px;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px;min-width:0}

  /* ---------- top ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  /* min-width:0 để ellipsis hoạt động trong flex (nếu không, text sẽ đẩy tràn) */
  .brand>div:last-child{min-width:0}
  .back{width:32px;height:32px;flex:none;display:grid;place-items:center;padding:0;border-radius:9px;
        border:1px solid var(--border-subtle);background:rgba(127,127,127,.07);color:var(--body);cursor:pointer;
        transition:background .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease),transform .1s var(--ease)}
  .back svg{width:16px;height:16px;display:block}
  .back:hover{background:rgba(127,127,127,.14);border-color:var(--border);color:var(--text)}
  .back:active{transform:scale(.95)}
  .mark{width:34px;height:34px;flex:none;border-radius:10px;background:linear-gradient(160deg,var(--accent),#4a52a8);display:grid;place-items:center;color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 4px 14px rgba(94,106,210,.28)}
  .mark svg{width:17px;height:17px;display:block;stroke-width:2.1}
  .brand h1{font-size:15.5px;font-weight:500;letter-spacing:-.02em;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brand p{font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .you{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 5px;border:1px solid var(--border-subtle);background:rgba(127,127,127,.06);border-radius:9999px;font-size:12px;font-weight:500;color:var(--body);flex:0 1 auto;min-width:0;max-width:38%}
  .you img,.you .pip{width:20px;height:20px;border-radius:50%;flex:none;object-fit:cover;background:var(--surface-hi);display:grid;place-items:center;font-size:10px;font-weight:600}
  .you span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- gate ---------- */
  .gate{border:1px solid var(--border-subtle);border-radius:var(--r-lg);padding:26px 20px;text-align:center;background:rgba(127,127,127,.04);min-width:0}
  .gate .big{width:52px;height:52px;margin:0 auto 12px;border-radius:14px;background:rgba(94,106,210,.13);border:1px solid rgba(94,106,210,.25);display:grid;place-items:center;color:var(--accent-hi)}
  .gate .big svg{width:24px;height:24px;display:block}
  .gate h2{font-size:16px;font-weight:600;margin-bottom:6px;overflow-wrap:anywhere}
  .gate p{font-size:13px;color:var(--muted);line-height:1.6;overflow-wrap:anywhere}
  .gate button{margin-top:16px;background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;max-width:100%}

  /* ---------- label ---------- */
  .label-row{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px}
  .overline{font-size:10.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
  .count{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:var(--faint)}

  /* ---------- digest card ---------- */
  .list{display:flex;flex-direction:column;gap:10px;min-width:0}
  .dg{border:1px solid var(--border-subtle);border-radius:var(--r-lg);background:rgba(127,127,127,.035);overflow:hidden;animation:rise .34s var(--ease) both;min-width:0}
  .dg>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:11px;min-width:0}
  .dg>summary::-webkit-details-marker{display:none}
  .dg .no{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:var(--accent-hi);background:rgba(94,106,210,.14);border:1px solid rgba(94,106,210,.26);border-radius:7px;padding:3px 7px;flex:none}
  .dg .head{flex:1;min-width:0}
  /* cắt gọn 1 dòng: tiêu đề kỳ và dòng meta đều có thể dài */
  .dg .when{display:block;font-size:13.5px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dg .meta{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;font-family:'JetBrains Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dg .chev{flex:none;display:flex;align-items:center;color:var(--faint);transition:transform .18s var(--ease)}
  .dg .chev svg{width:15px;height:15px;display:block}
  .dg[open] .chev{transform:rotate(90deg)}
  /* nội dung: phá từ dài (URL, hash, chuỗi không dấu cách) để KHÔNG tràn ngang */
  .dg .body{padding:2px 15px 16px;border-top:1px solid var(--border-hair);font-size:13.5px;line-height:1.68;color:var(--body);min-width:0;overflow-wrap:anywhere;word-break:break-word}
  .dg .body h3{font-size:13px;font-weight:600;color:var(--text);margin:14px 0 5px;overflow-wrap:anywhere}
  .dg .body ul{margin:5px 0 5px 18px;padding-left:0}
  .dg .body li{margin:3px 0;overflow-wrap:anywhere}
  .dg .body p{margin:7px 0;overflow-wrap:anywhere}
  .dg .body b,.dg .body strong{color:var(--text);font-weight:600}
  .dg .body code{font-family:'JetBrains Mono',monospace;font-size:12px;background:rgba(127,127,127,.14);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere;word-break:break-word}
  .dg .body img,.dg .body table{max-width:100%}
  .dg .body .body-load{margin:10px 0;color:var(--muted);font-size:12.5px}

  /* ---------- misc ---------- */
  .foot{display:flex;align-items:center;gap:7px;padding-top:12px;border-top:1px solid var(--border-hair);margin-top:auto;min-width:0}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--faint);opacity:.45;flex:none;transition:background .3s,opacity .3s}
  .dot.on{background:var(--ok);opacity:1}
  .foot span{font-size:11px;color:var(--faint);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{padding:40px 16px;text-align:center;border:1px dashed var(--border-subtle);border-radius:var(--r-lg);color:var(--faint);font-size:12.5px;line-height:1.6;overflow-wrap:anywhere}
  .skeleton{height:78px;border-radius:var(--r-lg);background:linear-gradient(90deg,rgba(127,127,127,.07),rgba(127,127,127,.14),rgba(127,127,127,.07));background-size:200% 100%;animation:sh 1.4s linear infinite}
  @keyframes sh{to{background-position:-200% 0}}
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---------- màn nhỏ: siết khoảng đệm, giữ chữ đọc được ---------- */
  @media (max-width:380px){
    .shell{padding-left:12px;padding-right:12px;gap:15px}
    .dg>summary{padding:12px;gap:9px}
    .dg .when{font-size:13px}
    .dg .body{padding:2px 12px 14px;font-size:13px}
    .dg .body ul{margin-left:16px}
    .brand h1{font-size:14.5px}
    .you{max-width:34%}
  }
  /* màn rộng: thêm chút thoáng */
  @media (min-width:520px){
    .dg .body{font-size:14px}
  }
</style>
</head>
<body>
<main class="shell">

  <header class="top">
    <div class="brand">
      <button class="back" id="back" type="button" aria-label="Về App Hub" title="Về App Hub">
        <i data-icon="arrow-left" data-size="16"></i>
      </button>
      <div class="mark"><i data-icon="book-open" data-size="17"></i></div>
      <div>
        <h1>Sổ Tay Nhóm</h1>
        <p id="subtitle">Tóm tắt cuộc nói chuyện · riêng tư trong nhóm</p>
      </div>
    </div>
    <div class="you" id="you" hidden></div>
  </header>

  <section class="gate" id="gate" hidden>
    <div class="big" id="gateIcon"></div>
    <h2 id="gateTitle">Chỉ thành viên nhóm mới xem được</h2>
    <p id="gateText">Mở app này từ trong nhóm chat nhé.</p>
    <button id="gateBtn" hidden>Đóng</button>
  </section>

  <div class="label-row" id="listLabel" hidden>
    <span class="overline">Các kỳ tóm tắt</span>
    <span class="count" id="count"></span>
  </div>

  <div class="list" id="list"></div>

  <div class="empty" id="empty" hidden></div>

  <footer class="foot">
    <span class="dot" id="dot"></span>
    <span id="status">Đang khởi động…</span>
  </footer>

</main>

<script>
/* ============================================================
 * Sổ Tay Nhóm — tóm tắt hội thoại nhóm, chỉ thành viên xem được
 * ------------------------------------------------------------
 * Dữ liệu: cron của Hermes tóm tắt mỗi 200 tin nhắn rồi đẩy lên
 * Worker (worker/src/index.js). App KHÔNG nói trực tiếp với
 * Firestore nữa → không còn API key nào trong repo.
 *
 * Quyền: app gửi nguyên `tg.initData` (Telegram ký HMAC-SHA256)
 * cho Worker; Worker tự xác minh chữ ký rồi mới trả dữ liệu.
 * Firestore rules không tính được HMAC nên không thể làm thay.
 * ============================================================ */
const API = 'https://games-hub-api.PLACEHOLDER.workers.dev';   // ← điền sau khi deploy worker/
const GROUP_NAME = '6 thằng già không ngồi chung có 1 thằng VinGroup';
const GATE_HREF = 'https://t.me/c/1769279835/1';                // mở nhóm (chỉ thành viên vào được)
const CACHE_KEY = 'stn_cache_v1';

const tg   = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.platform && tg.platform !== 'unknown');
const $    = id => document.getElementById(id);

if (inTg) {
  tg.ready(); tg.expand();
  if (tg.onEvent) tg.onEvent('themeChanged', () => {
    document.documentElement.setAttribute('data-theme', tg.colorScheme === 'light' ? 'light' : 'dark');
  });
  document.documentElement.setAttribute('data-theme', tg.colorScheme === 'light' ? 'light' : 'dark');
}

/* ---------------- gọi Worker ---------------- */
const initData = () => (inTg && tg.initData) || '';

async function api(path) {
  const u = new URL(API + path);
  u.searchParams.set('initData', initData());
  try {
    const r = await fetch(u.toString());
    let body = null;
    try { body = await r.json(); } catch (e) {}
    return { status: r.status, body };
  } catch (e) {
    return { status: 0, body: null };
  }
}

/* ---------------- cache cục bộ: mở lại là thấy ngay ---------------- */
let cache = { who: null, rows: [], bodies: {} };
try { cache = Object.assign(cache, JSON.parse(localStorage.getItem(CACHE_KEY) || '{}')); } catch (e) {}
let cacheTimer = null;
function saveCache() {
  clearTimeout(cacheTimer);
  cacheTimer = setTimeout(() => {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch (e) {}
  }, 250);
}

/* ---------------- trạng thái chặn ---------------- */
const GATES = {
  'no-tg': ['lock', 'Mở app trong Telegram',
    'Sổ Tay Nhóm chỉ mở được bằng Telegram (Mini App). Bạn đang mở bằng trình duyệt nên không xem được nội dung.'],
  'bad-signature': ['lock', 'Không xác minh được Telegram',
    'Telegram không gửi kèm chữ ký hợp lệ. Đóng app rồi mở lại từ nút trong nhóm nhé.'],
  'expired': ['hourglass', 'Phiên Telegram đã cũ',
    'Chữ ký quá 24 giờ. Đóng rồi mở lại app là có phiên mới.'],
  'not-member': ['clock', 'Chờ duyệt',
    'Bạn chưa có tên trong danh sách xem sổ. Nhắn một câu vào nhóm để xin quyền — duyệt xong mở lại là đọc được ngay.'],
  'offline': ['wifi-off', 'Không kết nối được',
    'Mạng đang chập hoặc máy chủ chưa sẵn sàng. Thử lại sau ít phút nhé.']
};

function showGate(kind, who) {
  const g = GATES[kind] || GATES['offline'];
  clearSkeletons();
  $('gate').hidden = false;
  $('gateIcon').innerHTML = window.Icons ? Icons.get(g[0], 24) : '';
  $('gateTitle').textContent = g[1];
  $('gateText').innerHTML = esc(g[2]) + (who ? '<br><br>Đang xin cho: <b>' + esc(who) + '</b>' : '');
  $('listLabel').hidden = true;
  $('status').textContent = 'Chưa mở được';
  if (inTg) {
    const btn = $('gateBtn');
    btn.hidden = false;
    btn.textContent = 'Mở nhóm để xin quyền';
    btn.onclick = () => { try { tg.openTelegramLink(GATE_HREF); } catch (e) {} };
  }
}

/* ---------------- skeleton ---------------- */
function showSkeletons() {
  $('list').innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const d = document.createElement('div');
    d.className = 'skeleton';
    $('list').appendChild(d);
  }
}
function clearSkeletons() {
  if ($('list').querySelector('.skeleton')) $('list').innerHTML = '';
}

/* ---------------- người xem ---------------- */
function renderYou(who) {
  const name = (who && (who.name || who.username)) || '';
  if (!name) return;
  const el = $('you');
  el.hidden = false;
  el.innerHTML = (who.photo
      ? '<img src="' + esc(who.photo) + '" alt="">'
      : '<span class="pip">' + esc(name.charAt(0).toUpperCase()) + '</span>')
    + '<span></span>';
  el.querySelector('span:last-child').textContent = name;
}

/* ---------------- định dạng ---------------- */
function fmtRange(a, b) {
  const opt = { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' };
  const f = t => { try { return new Date(t).toLocaleString('vi-VN', opt); } catch (e) { return '?'; } };
  if (a && b) {
    try {
      const da = new Date(a), db = new Date(b);
      // Cùng ngày → bỏ phần ngày lặp lại: "01-01 18:00 → 20:00"
      // (trên màn hẹp, dạng đầy đủ sẽ bị ellipsis cắt mất giờ kết thúc)
      if (da.toDateString() === db.toDateString()) {
        return da.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' })
             + ' ' + da.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
             + ' → ' + db.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
      }
    } catch (e) {}
  }
  return f(a) + ' → ' + f(b);
}

/* markdown tối giản: **bold**, *italic*, `code`, gạch đầu dòng, tiêu đề ### */
function md(s) {
  const src = String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const lines = src.split(/\r?\n/);
  let out = '', inUl = false;
  const inline = t => t
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  for (const raw of lines) {
    const l = raw.trim();
    if (!l) { if (inUl) { out += '</ul>'; inUl = false; } continue; }
    if (/^#{1,4}\s+/.test(l)) {
      if (inUl) { out += '</ul>'; inUl = false; }
      out += '<h3>' + inline(l.replace(/^#{1,4}\s+/, '')) + '</h3>';
    } else if (/^[-*•]\s+/.test(l)) {
      if (!inUl) { out += '<ul>'; inUl = true; }
      out += '<li>' + inline(l.replace(/^[-*•]\s+/, '')) + '</li>';
    } else {
      if (inUl) { out += '</ul>'; inUl = false; }
      out += '<p>' + inline(l) + '</p>';
    }
  }
  if (inUl) out += '</ul>';
  return out;
}

/* ---------------- dựng danh sách ---------------- */
function bodyHtml(d) {
  return cache.bodies[d.n] ? md(cache.bodies[d.n])
                           : '<div class="body-load">Đang tải nội dung…</div>';
}

function renderList(rows) {
  $('list').innerHTML = rows.map((d, i) => (
    '<details class="dg" data-n="' + d.n + '"' + (i === 0 ? ' open' : '') + '>' +
      '<summary>' +
        '<span class="no">#' + d.n + '</span>' +
        '<span class="head"><span class="when">' + esc(d.title || ('Kỳ #' + d.n)) + '</span>' +
          '<span class="meta">' + fmtRange(d.from, d.to) + ' · ' + (d.msgs || 0) + ' tin</span></span>' +
        '<span class="chev"><i data-icon="chevron-right" data-size="15"></i></span>' +
      '</summary>' +
      '<div class="body">' + bodyHtml(d) + '</div>' +
    '</details>'
  )).join('');
  if (window.Icons) Icons.hydrate($('list'));
  $('list').querySelectorAll('details[open]').forEach(ensureBody);
}

/* Nội dung nặng chỉ tải khi mở kỳ đó → danh sách nhẹ, mở nhanh */
async function ensureBody(det) {
  const n = +det.dataset.n;
  const box = det.querySelector('.body');
  if (!box || !box.querySelector('.body-load')) return;
  const r = await api('/digest/' + n);
  if (r.status !== 200 || !r.body || !r.body.digest) {
    box.innerHTML = '<p class="body-load">Không tải được kỳ này.</p>';
    return;
  }
  cache.bodies[n] = r.body.digest.body;
  saveCache();
  box.innerHTML = md(r.body.digest.body);
}

$('list').addEventListener('toggle', (e) => {
  if (e.target.tagName === 'DETAILS' && e.target.open) ensureBody(e.target);
}, true);

/* ---------------- tải dữ liệu ---------------- */
let lastSig = null;

async function load() {
  const r = await api('/digests');

  if (r.status === 403) {
    showGate((r.body && r.body.error) || 'not-member', cache.who && cache.who.name);
    return;
  }
  if (r.status !== 200 || !r.body) {
    $('dot').classList.remove('on');
    if (!cache.rows.length) showGate('offline');
    else $('status').textContent = 'Không cập nhật được';
    return;
  }

  $('dot').classList.add('on');
  $('gate').hidden = true;
  $('subtitle').textContent = GROUP_NAME;
  cache.who = r.body.who || cache.who;
  renderYou(cache.who);

  const rows = r.body.digests || [];
  $('status').textContent = 'Cập nhật · ' +
    new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });

  if (!rows.length) {
    clearSkeletons();
    $('list').innerHTML = '';
    $('empty').hidden = false;
    $('empty').textContent = 'Chưa có kỳ tóm tắt nào. Sổ tự ghi khi nhóm tích đủ 200 tin nhắn mới.';
    $('listLabel').hidden = true;
    cache.rows = []; saveCache();
    return;
  }

  clearSkeletons();
  $('empty').hidden = true;
  $('listLabel').hidden = false;
  $('count').textContent = rows.length + ' kỳ';

  const sig = rows[0].n + ':' + rows.length;
  if (sig === lastSig && $('list').querySelector('details')) return;   // không vẽ lại vô ích
  lastSig = sig;
  cache.rows = rows;
  saveCache();
  renderList(rows);
}

/* ---------------- nút về Hub ---------------- */
$('back').onclick = () => {
  try { if (inTg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
  window.location.href = '../';
};

/* ---------------- boot ---------------- */
(function boot() {
  // 1) hiện ngay từ cache (nếu đã từng mở) → cảm giác mở tức thì
  if (cache.rows && cache.rows.length) {
    $('subtitle').textContent = GROUP_NAME;
    $('listLabel').hidden = false;
    $('count').textContent = cache.rows.length + ' kỳ';
    renderYou(cache.who);
    renderList(cache.rows);
    $('status').textContent = 'Đang cập nhật…';
  } else {
    showSkeletons();
    $('status').textContent = 'Đang kiểm tra quyền…';
  }
  // 2) rồi mới xác minh + lấy dữ liệu thật
  if (!inTg) { showGate('no-tg'); return; }
  if (!initData()) { showGate('bad-signature'); return; }
  load();
  setInterval(load, 60000);
})();

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
</script>
</body>
