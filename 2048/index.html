<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🔢 2048</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; font-family: 'Segoe UI', -apple-system, system-ui, sans-serif;
    background: var(--tg-bg, #faf8ef); color: #776e65;
    user-select: none; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 12px;
  }
  .header { width: 100%; max-width: 460px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
  h1 { font-size: 44px; font-weight: 800; color: #776e65; line-height: 1; }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: #bbada0; color: #fff; padding: 6px 14px; border-radius: 8px;
    text-align: center; min-width: 76px;
  }
  .score-box .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: .85; }
  .score-box .val { font-size: 22px; font-weight: 700; }
  .bar { width: 100%; max-width: 460px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
  .bar p { font-size: 13px; color: #8f8578; flex: 1; }
  .btn {
    background: #8f7a66; color: #fff; border: none; padding: 10px 18px; border-radius: 8px;
    font-size: 14px; font-weight: 700; cursor: pointer; transition: background .15s, transform .1s;
    white-space: nowrap;
  }
  .btn:hover { background: #9f8b77; }
  .btn:active { transform: scale(.96); }

  .board-wrap { position: relative; width: 100%; max-width: 460px; aspect-ratio: 1; }
  #board {
    position: absolute; inset: 0; background: #bbada0; border-radius: 10px; padding: var(--pad);
    display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
    gap: var(--pad);
  }
  .cell { background: rgba(238,228,218,0.35); border-radius: 6px; }
  .tile-layer { position: absolute; inset: 0; pointer-events: none; }
  .tile {
    position: absolute; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; font-weight: 800; transition: transform .13s ease-in-out;
    will-change: transform;
  }
  .tile.new { animation: appear .18s ease-out; }
  .tile.merged { animation: pop .18s ease-out; z-index: 3; }
  .tile.gone { z-index: 1; }
  @keyframes appear { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.18); } 100% { transform: scale(1); } }

  /* tile colors */
  .t2    { background:#eee4da; color:#776e65; }
  .t4    { background:#ede0c8; color:#776e65; }
  .t8    { background:#f2b179; color:#f9f6f2; }
  .t16   { background:#f59563; color:#f9f6f2; }
  .t32   { background:#f67c5f; color:#f9f6f2; }
  .t64   { background:#f65e3b; color:#f9f6f2; }
  .t128  { background:#edcf72; color:#f9f6f2; }
  .t256  { background:#edcc61; color:#f9f6f2; }
  .t512  { background:#edc850; color:#f9f6f2; }
  .t1024 { background:#edc53f; color:#f9f6f2; }
  .t2048 { background:#edc22e; color:#f9f6f2; box-shadow: 0 0 24px rgba(237,194,46,.7); }
  .tsuper{ background:#3c3a32; color:#f9f6f2; }

  .overlay {
    position: absolute; inset: 0; border-radius: 10px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; z-index: 10;
    background: rgba(238,228,218,0.82); backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay h2 { font-size: 34px; color: #776e65; }
  .overlay .btns { display: flex; gap: 10px; }
  .hint { text-align: center; font-size: 12px; color: #a89b8c; margin-top: 14px; max-width: 460px; }
</style>
</head>
<body>
  <div class="header">
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box"><div class="label">Điểm</div><div class="val" id="score">0</div></div>
      <div class="score-box"><div class="label">Kỷ lục</div><div class="val" id="best">0</div></div>
    </div>
  </div>
  <div class="bar">
    <p>Ghép các ô để đạt <b>2048</b>!</p>
    <button class="btn" id="newgame">↻ Ván mới</button>
  </div>
  <div class="board-wrap">
    <div id="board"></div>
    <div class="tile-layer" id="tile-layer"></div>
    <div class="overlay" id="overlay">
      <h2 id="over-title">Bạn thắng! 🎉</h2>
      <div class="btns">
        <button class="btn" id="keepgoing" style="display:none;">Tiếp tục</button>
        <button class="btn" id="retry">Ván mới</button>
      </div>
    </div>
  </div>
  <p class="hint">Vuốt hoặc dùng phím mũi tên / WASD để di chuyển</p>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
// ===== Telegram Web App =====
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('#faf8ef'); tg.setBackgroundColor('#faf8ef'); } catch(e){}
}
function haptic() { try { tg?.HapticFeedback?.impactOccurred('light'); } catch(e){} }

// ===== Config =====
const SIZE = 4;
const boardEl = document.getElementById('board');
const layer = document.getElementById('tile-layer');
const overlay = document.getElementById('overlay');
const overTitle = document.getElementById('over-title');
const keepGoingBtn = document.getElementById('keepgoing');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');

// build cells
for (let i = 0; i < SIZE * SIZE; i++) {
  const c = document.createElement('div'); c.className = 'cell'; boardEl.appendChild(c);
}

// ===== State =====
let grid, tiles, score, best, idc, won, over, keepPlaying;
best = parseInt(localStorage.getItem('best2048') || '0', 10);

function emptyGrid() {
  return Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
}

function setPos(el, x, y, animate) {
  const cell = window.__cell, gap = window.__gap, pad = window.__pad;
  const tx = pad + x * (cell + gap);
  const ty = pad + y * (cell + gap);
  if (!animate) el.style.transition = 'none';
  el.style.width = cell + 'px';
  el.style.height = cell + 'px';
  el.style.transform = `translate(${tx}px, ${ty}px)`;
  el.style.fontSize = fontSize(cell, el.dataset.value ? +el.dataset.value : 2);
  if (!animate) { void el.offsetWidth; el.style.transition = ''; }
}

function fontSize(cell, value) {
  const len = String(value).length;
  const base = cell * (len <= 2 ? 0.5 : len === 3 ? 0.42 : len === 4 ? 0.34 : 0.27);
  return Math.round(base) + 'px';
}

function measure() {
  const wrap = boardEl;
  const rect = wrap.getBoundingClientRect();
  const padPx = Math.max(8, rect.width * 0.025);
  const gapPx = padPx;
  const cellPx = (rect.width - padPx * (SIZE + 1)) / SIZE;
  window.__pad = padPx; window.__gap = gapPx; window.__cell = cellPx;
  boardEl.style.setProperty('--pad', padPx + 'px');
  layer.style.setProperty('--pad', padPx + 'px');
  boardEl.style.gap = gapPx + 'px';
  boardEl.style.padding = padPx + 'px';
  document.documentElement.style.setProperty('--pad', padPx + 'px');
}

// ===== New game =====
function newGame() {
  grid = emptyGrid();
  tiles = [];
  score = 0;
  idc = 0;
  won = false; over = false; keepPlaying = false;
  overlay.classList.remove('show');
  layer.innerHTML = '';
  tileEls.clear();
  addRandomTile();
  addRandomTile();
  measure();
  renderAll();
  updateScores();
}

const tileEls = new Map();

function addRandomTile() {
  const empty = [];
  for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) if (!grid[y][x]) empty.push({ x, y });
  if (!empty.length) return null;
  const { x, y } = empty[Math.floor(Math.random() * empty.length)];
  const value = Math.random() < 0.9 ? 2 : 4;
  const t = { id: idc++, x, y, px: x, py: y, value, isNew: true, justMerged: false };
  grid[y][x] = t; tiles.push(t);
  return t;
}

function tileClass(v) {
  return 't' + (v > 2048 ? 'super' : v);
}

function renderAll() {
  layer.innerHTML = '';
  tileEls.clear();
  tiles.forEach(t => {
    const el = document.createElement('div');
    el.className = 'tile ' + tileClass(t.value);
    el.dataset.value = t.value;
    el.textContent = t.value;
    setPos(el, t.x, t.y, false);
    layer.appendChild(el);
    tileEls.set(t.id, el);
  });
}

function updateScores() {
  scoreEl.textContent = score;
  if (score > best) { best = score; localStorage.setItem('best2048', String(best)); }
  bestEl.textContent = best;
}

// ===== Move =====
const VECTORS = { up: { x: 0, y: -1 }, right: { x: 1, y: 0 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 } };

function buildTraversals(v) {
  const xs = [], ys = [];
  for (let i = 0; i < SIZE; i++) { xs.push(i); ys.push(i); }
  if (v.x === 1) xs.reverse();
  if (v.y === 1) ys.reverse();
  return { xs, ys };
}

function findFarthest(cell, v) {
  let prev, cur = { x: cell.x, y: cell.y };
  do {
    prev = cur;
    cur = { x: prev.x + v.x, y: prev.y + v.y };
  } while (inBounds(cur) && !grid[cur.y][cur.x]);
  return { farthest: prev, next: inBounds(cur) ? cur : null };
}

function inBounds(p) { return p.x >= 0 && p.x < SIZE && p.y >= 0 && p.y < SIZE; }

function move(dir) {
  if (over || (won && !keepPlaying)) return;
  const v = VECTORS[dir];
  const { xs, ys } = buildTraversals(v);
  let moved = false;
  const removals = []; // {el, x, y} animate out

  tiles.forEach(t => { t.px = t.x; t.py = t.y; t.isNew = false; t.justMerged = false; });

  const newTiles = [];

  ys.forEach(y => {
    xs.forEach(x => {
      const tile = grid[y][x];
      if (!tile) return;
      const { farthest, next } = findFarthest({ x, y }, v);
      const nextTile = next ? grid[next.y][next.x] : null;

      if (nextTile && nextTile.value === tile.value && !nextTile.mergedThisTurn) {
        // merge
        const merged = { id: idc++, x: next.x, y: next.y, px: tile.x, py: tile.y, value: tile.value * 2, isNew: false, justMerged: true };
        grid[tile.y][tile.x] = null;
        grid[next.y][next.x] = merged;
        merged.mergedThisTurn = true;
        score += merged.value;
        // animate the two source elements into merge cell then remove
        const e1 = tileEls.get(tile.id);
        const e2 = tileEls.get(nextTile.id);
        if (e1) { e1.classList.add('gone'); removals.push({ el: e1, x: next.x, y: next.y }); tileEls.delete(tile.id); }
        if (e2) { e2.classList.add('gone'); removals.push({ el: e2, x: next.x, y: next.y }); tileEls.delete(nextTile.id); }
        newTiles.push(merged);
        moved = true;
      } else if (farthest.x !== tile.x || farthest.y !== tile.y) {
        grid[tile.y][tile.x] = null;
        tile.x = farthest.x; tile.y = farthest.y;
        grid[tile.y][tile.x] = tile;
        moved = true;
      }
    });
  });

  // clear mergedThisTurn flags on remaining tiles
  tiles.forEach(t => { t.mergedThisTurn = false; });

  if (!moved) return;

  // rebuild tiles array = all non-null grid tiles
  tiles = [];
  for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) if (grid[y][x]) tiles.push(grid[y][x]);

  haptic();
  animateMove(removals, newTiles);

  const added = addRandomTile();
  setTimeout(() => { if (added) renderAdded(added); }, 100);

  updateScores();
  setTimeout(checkState, 160);
}

function animateMove(removals, newTiles) {
  // move existing tile elements
  tiles.forEach(t => {
    const el = tileEls.get(t.id);
    if (el && !t.justMerged) setPos(el, t.x, t.y, true);
  });
  // animate removals into the merge cell then destroy
  removals.forEach(({ el, x, y }) => {
    setPos(el, x, y, true);
    setTimeout(() => el.remove(), 140);
  });
  // create merged tiles
  newTiles.forEach(t => {
    const el = document.createElement('div');
    el.className = 'tile ' + tileClass(t.value) + ' merged';
    el.dataset.value = t.value;
    el.textContent = t.value;
    // start at source position, then move into place
    setPos(el, t.px, t.py, false);
    layer.appendChild(el);
    requestAnimationFrame(() => setPos(el, t.x, t.y, true));
    tileEls.set(t.id, el);
    el.addEventListener('animationend', () => el.classList.remove('merged'), { once: true });
  });
}

function renderAdded(t) {
  const el = document.createElement('div');
  el.className = 'tile ' + tileClass(t.value) + ' new';
  el.dataset.value = t.value;
  el.textContent = t.value;
  setPos(el, t.x, t.y, false);
  layer.appendChild(el);
  tileEls.set(t.id, el);
  el.addEventListener('animationend', () => el.classList.remove('new'), { once: true });
}

function movesAvailable() {
  for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
    const t = grid[y][x];
    if (!t) return true;
    if (x < SIZE - 1 && grid[y][x + 1] && grid[y][x + 1].value === t.value) return true;
    if (y < SIZE - 1 && grid[y + 1][x] && grid[y + 1][x].value === t.value) return true;
  }
  return false;
}

function checkState() {
  const max = Math.max(...tiles.map(t => t.value));
  if (max >= 2048 && !won) {
    won = true;
    overTitle.textContent = 'Bạn thắng! 🎉';
    keepGoingBtn.style.display = 'inline-block';
    overlay.classList.add('show');
    return;
  }
  if (!movesAvailable()) {
    over = true;
    overTitle.textContent = 'Hết nước rồi! 😅';
    keepGoingBtn.style.display = 'none';
    overlay.classList.add('show');
  }
}

// ===== Input =====
const keyMap = {
  ArrowUp: 'up', ArrowRight: 'right', ArrowDown: 'down', ArrowLeft: 'left',
  w: 'up', d: 'right', s: 'down', a: 'left', W: 'up', D: 'right', S: 'down', A: 'left'
};
window.addEventListener('keydown', e => {
  const dir = keyMap[e.key];
  if (dir) { e.preventDefault(); move(dir); }
});

let touchStart = null;
boardEl.addEventListener('touchstart', e => {
  const t = e.changedTouches[0]; touchStart = { x: t.clientX, y: t.clientY };
}, { passive: true });
boardEl.addEventListener('touchend', e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  if (Math.max(ax, ay) < 24) return;
  move(ax > ay ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  touchStart = null;
}, { passive: true });

// pointer drag (desktop / non-touch)
let down = null;
boardEl.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') down = { x: e.clientX, y: e.clientY }; });
window.addEventListener('pointerup', e => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  down = null;
  if (Math.max(ax, ay) < 30) return;
  move(ax > ay ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});

document.getElementById('newgame').addEventListener('click', newGame);
document.getElementById('retry').addEventListener('click', newGame);
keepGoingBtn.addEventListener('click', () => { keepPlaying = true; overlay.classList.remove('show'); });

window.addEventListener('resize', () => {
  measure();
  tiles.forEach(t => { const el = tileEls.get(t.id); if (el) setPos(el, t.x, t.y, false); });
});

// ===== Start =====
newGame();
</script>
</body>
</html>
