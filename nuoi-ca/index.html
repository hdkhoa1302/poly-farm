<script type="module">
import * as THREE from 'three';

/* ---------- Hằng số & Logic thuần ---------- */
const CaLogic = {
  C: { FISH_KINDS: { guppy: 60, gold: 120, angel: 240 }, FISH_MAX_SIZE: 3.0, FISH_FEED_GROW: 0.12, FISH_SIZE_MIN: 1.0, FISH_PAY_PER_MIN: 6, FISH_ACCRUE_CAP: 7200, FISH_FEED_GAP: 900, FISH_MAX_TANK: 40, FISH_MAX_OWNED: 8, NAME_MAX: 12 },
  size(fed) { return Math.min(CaLogic.C.FISH_MAX_SIZE, +(1.0 + Math.max(0, Number(fed) || 0) * CaLogic.C.FISH_FEED_GROW).toFixed(3)); },
  pay(fish, nowMs) {
    const now = nowMs || Date.now(), last = (fish && (fish.lastPay || fish.bornAt)) || now;
    const sec = Math.max(0, Math.min(CaLogic.C.FISH_ACCRUE_CAP, (now - last) / 1000));
    return Math.floor(sec * ((fish && fish.size != null) ? fish.size : CaLogic.size(fish && fish.fed)) * CaLogic.C.FISH_PAY_PER_MIN / 60);
  },
  priceOf(kind) { return CaLogic.C.FISH_KINDS[kind] || 0; },
  canBuy(coins, kind, ownedCount, tankCount) {
    const p = CaLogic.priceOf(kind);
    return Boolean(p > 0 && (coins || 0) >= p && (ownedCount || 0) < CaLogic.C.FISH_MAX_OWNED && (tankCount || 0) < CaLogic.C.FISH_MAX_TANK);
  },
  hueOf(ownerId) {
    let n = 0;
    if (typeof ownerId === 'number') n = ownerId;
    else if (typeof ownerId === 'string') {
      const p = parseInt(ownerId.replace(/^[^\d]*/, ''), 10);
      if (!isNaN(p) && p > 0) n = p;
      else { for (let i = 0; i < ownerId.length; i++) n = (n * 31 + ownerId.charCodeAt(i)) >>> 0; }
    }
    return Number(((BigInt(Math.abs(n || 1)) * 2654435761n) % 360n + 360n) % 360n);
  },
  move(fish, nowMs, tank) {
    const t = nowMs || 0, w = (tank && (tank.w || tank.width)) || 360, h = (tank && (tank.h || tank.height)) || 640, d = (tank && (tank.d || tank.depth)) || 200;
    let s = String((fish && fish.id) || 1), idNum = 1;
    for (let i = 0; i < s.length; i++) idNum = (Math.imul(31, idNum) + s.charCodeAt(i)) | 0;
    idNum = Math.abs(idNum);
    const sz = (fish && fish.size) || 1, spd = 0.0006 + 0.00035 / sz;
    const TAU = Math.PI * 2;
    /* Băm id thành số 32 bit rồi rải pha — nếu chỉ dịch bit thì id 1,2,3… trùng pha, cá chồng lên nhau. */
    const hb = Math.imul(idNum ^ 0x9e3779b9, 0x85ebca6b) >>> 0;
    const cut = (x, m) => Math.floor(x / m) % 997;
    const pX = ((idNum % 997) * 0.6213) % TAU, pY = ((cut(hb, 1) % 991) * 0.5171) % TAU, pZ = ((cut(hb, 997) % 983) * 0.4137) % TAU;
    const band = ((cut(hb, 1009) % 7) - 3) * 0.055;   // mỗi con một tầng nước riêng, khỏi dồn một chỗ
    const fX = 0.75 + (cut(hb, 31) % 5) * 0.12, fY = 0.55 + (cut(hb, 37) % 5) * 0.1, fZ = 0.65 + (cut(hb, 41) % 5) * 0.11;
    const padX = 40, padTop = 65, padBot = 85, padZ = 30;
    const effW = Math.max(40, w - padX * 2), effH = Math.max(40, h - padTop - padBot), effD = Math.max(20, d - padZ * 2);
    const ax = fX * t * spd + pX, ay = fY * t * spd + pY, az = fZ * t * spd + pZ;
    return {
      x: padX + effW * 0.5 + effW * 0.44 * Math.sin(ax),
      y: padTop + effH * 0.5 + effH * (0.34 * Math.sin(ay) + band),
      z: padZ + effD * 0.5 + effD * 0.4 * Math.sin(az),
      dirX: Math.cos(ax) >= 0 ? 1 : -1,
      dirZ: Math.cos(az) >= 0 ? 1 : -1
    };
  },
  parseState(jsonText) {
    try { const d = typeof jsonText === 'string' ? JSON.parse(jsonText) : jsonText; return (d && typeof d === 'object') ? d : null; } catch (e) { return null; }
  }
};
if (typeof window !== 'undefined') window.CaLogic = CaLogic;
if (typeof globalThis !== 'undefined') globalThis.CaLogic = CaLogic;

/* ---------- Khởi tạo & Mạng ---------- */
const WORKER = (window.GamesHub && window.GamesHub.WORKER) || 'https://games-hub-api.hdkhoa1302.workers.dev';
let gameState = { fish: [], keepers: [] }, myKeeper = { id: 0, name: 'Tôi', coins: 0, earned: 0, fed: 0, fishes: 0 };
let isGuestMode = false, selectedKind = 'guppy', dbgSeq = 0;
const foods = [], bubbles = [], fxList = [];

async function api(path, body) {
  try {
    const opts = body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { method: 'GET', cache: 'no-store' };
    const res = await fetch(WORKER + path, opts);
    return await res.json();
  } catch (e) { return { ok: false, error: String(e) }; }
}
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el.t); el.t = setTimeout(() => el.classList.remove('show'), 1800);
}
function updateGuestBanner() { document.getElementById('guest-bar').classList.toggle('hidden', !isGuestMode); }
function renderHud() {
  const p = window.GamesHub ? window.GamesHub.player() : { id: 'guest', name: 'Khách' };
  if (!myKeeper.name || myKeeper.name === 'Tôi') myKeeper.name = p.name;
  if (!myKeeper.id && p.tgId) myKeeper.id = p.tgId;
  const myOwned = gameState.fish.filter(f => String(f.ownerId) === String(myKeeper.id)).length;
  document.getElementById('hud-coins').textContent = (myKeeper.coins || 0).toLocaleString('vi-VN');
  document.getElementById('hud-fishes').textContent = myOwned + '/' + CaLogic.C.FISH_MAX_OWNED;
  document.getElementById('hud-fed').textContent = myKeeper.fed || 0;
  document.getElementById('hud-tank').textContent = gameState.fish.length + '/' + CaLogic.C.FISH_MAX_TANK;
  let myPay = 0;
  for (const f of gameState.fish) { if (String(f.ownerId) === String(myKeeper.id)) myPay += CaLogic.pay(f, Date.now()); }
  const badge = document.getElementById('badge-pay');
  if (myPay > 0) { badge.textContent = '+' + myPay; badge.classList.add('show'); } else badge.classList.remove('show');
}
async function joinAo() {
  const idData = window.GamesHub ? window.GamesHub.initData() : '';
  if (!idData) { isGuestMode = true; updateGuestBanner(); await fetchLive(); return; }
  const res = await api('/fish/join', { initData: idData }); /* POST /fish/join */
  if (res && res.ok) {
    if (res.you) myKeeper = res.you;
    if (res.fish) gameState.fish = res.fish;
    if (res.keepers) gameState.keepers = res.keepers;
    if (res.granted) showToast('Chào mừng bạn! Ao tặng bạn 1 chú cá con!');
  } else { isGuestMode = true; updateGuestBanner(); await fetchLive(); }
  renderHud();
}
async function fetchLive() {
  const res = await api('/fish/live'); /* GET /fish/live */
  if (res && res.ok) {
    if (res.fish) {
      const fedMap = new Map(gameState.fish.map(f => [f.id, f.fedAtLocal]));
      res.fish.forEach(f => { if (fedMap.has(f.id)) f.fedAtLocal = fedMap.get(f.id); });
      gameState.fish = res.fish;
    }
    if (res.keepers) gameState.keepers = res.keepers;
    renderHud();
  }
}

/* ---------- Đồ hoạ 3D Three.js ---------- */
const appEl = document.getElementById('app'), stageEl = document.getElementById('stage'), labelContainer = document.getElementById('fish-labels');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(appEl.clientWidth, appEl.clientHeight);
renderer.shadowMap.enabled = false;
renderer.domElement.id = 'tank';
stageEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x021b2d);
scene.fog = new THREE.Fog(0x021b2d, 14, 28);
const camera = new THREE.PerspectiveCamera(50, appEl.clientWidth / appEl.clientHeight, 0.1, 50);
camera.position.set(0, 0.2, 9.6); camera.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0xd4eeff, 1.15));
const sunLight = new THREE.DirectionalLight(0xfff5dc, 1.35);
sunLight.position.set(4, 12, 6); scene.add(sunLight);

const BOX_W = 5.2, BOX_H = 7.4, BOX_D = 3.2, boxG = new THREE.BoxGeometry(1, 1, 1), sphG = new THREE.SphereGeometry(1, 8, 8);
const M = (c, tr, op) => new THREE.MeshLambertMaterial({ color: c, transparent: !!tr, opacity: op != null ? op : 1.0, flatShading: true });
const mkMesh = (g, mat, s, p) => { const m = new THREE.Mesh(g, mat); m.scale.set(s[0], s[1], s[2]); m.position.set(p[0], p[1], p[2]); return m; };

// Cảnh hồ kính, sỏi, rong, bong bóng
scene.add(mkMesh(boxG, M(0xc89f65), [BOX_W - 0.06, 0.5, BOX_D - 0.06], [0, -BOX_H / 2 + 0.2, 0]));
scene.add(mkMesh(boxG, M(0x022338), [BOX_W + 0.2, BOX_H + 0.4, 0.1], [0, 0, -BOX_D / 2 - 0.05]));
scene.add(mkMesh(boxG, M(0x04466d, true, 0.25), [0.08, BOX_H, BOX_D], [-BOX_W / 2 - 0.04, 0, 0]));
scene.add(mkMesh(boxG, M(0x04466d, true, 0.25), [0.08, BOX_H, BOX_D], [BOX_W / 2 + 0.04, 0, 0]));
scene.add(mkMesh(boxG, M(0x38bdf8, true, 0.08), [BOX_W, BOX_H, 0.04], [0, 0, BOX_D / 2]));
[[-1.75, 0.6], [0.5, -0.5], [1.7, 0.9]].forEach(([gx, gy]) => scene.add(mkMesh(boxG, M(0xeaf6ff, true, 0.07), [0.55, BOX_H * 0.82, 0.02], [gx, gy, BOX_D / 2 + 0.03])));
scene.add(mkMesh(boxG, M(0x0284c7, true, 0.12), [BOX_W - 0.04, BOX_H - 0.08, BOX_D - 0.04], [0, 0, 0]));
scene.add(mkMesh(boxG, M(0x081b29), [BOX_W + 0.36, 0.14, BOX_D + 0.36], [0, -BOX_H / 2, 0]));
scene.add(mkMesh(boxG, M(0x081b29), [BOX_W + 0.36, 0.14, BOX_D + 0.36], [0, BOX_H / 2, 0]));
[[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => scene.add(mkMesh(boxG, M(0x081b29), [0.1, BOX_H, 0.1], [sx * (BOX_W / 2), 0, sz * (BOX_D / 2)])));
scene.add(mkMesh(boxG, M(0x78716c), [0.55, 0.25, 0.4], [-1.4, -BOX_H / 2 + 0.55, 0.5]));
scene.add(mkMesh(boxG, M(0xa8a29e), [0.4, 0.2, 0.35], [1.3, -BOX_H / 2 + 0.52, -0.4]));
scene.add(mkMesh(boxG, M(0x57534e), [0.35, 0.18, 0.3], [0.2, -BOX_H / 2 + 0.5, 0.7]));

const seaweeds = [];
[-1.6, -0.6, 0.8, 1.8].forEach((rx, idx) => {
  const g = new THREE.Group(); g.position.set(rx, -BOX_H / 2 + 0.4, -0.4 + (idx % 2) * 0.8);
  const segs = []; let py = 0;
  for (let s = 0; s < 5; s++) { py += 0.35; const sm = mkMesh(boxG, M(s % 2 === 0 ? 0x22c55e : 0x16a34a), [0.18, 0.4, 0.18], [0, py, 0]); g.add(sm); segs.push(sm); }
  scene.add(g); seaweeds.push({ segs, offset: idx * 1.5 });
});
for (let i = 0; i < 18; i++) {
  const bm = mkMesh(sphG, M(0xdff2ff, true, 0.2), [0.05, 0.05, 0.05], [(Math.random() - 0.5) * (BOX_W * 0.85), (Math.random() - 0.5) * (BOX_H * 0.85), (Math.random() - 0.5) * (BOX_D * 0.75)]);
  scene.add(bm); bubbles.push({ mesh: bm, spd: 0.8 + Math.random() * 1.3, seed: Math.random() * 10 });
}
const waterTop = mkMesh(boxG, M(0x38bdf8, true, 0.25), [BOX_W - 0.1, 0.06, BOX_D - 0.1], [0, BOX_H / 2 - 0.05, 0]);
scene.add(waterTop);

// Mô hình cá 3 loại
const fishMeshes = new Map();
function createFishModel(kind, hue) {
  const root = new THREE.Group(), finMat = M(new THREE.Color(`hsl(${hue}, 85%, 62%)`)), tailGroup = new THREE.Group();
  const eyeMat = M(0x0f172a), shineMat = M(0xf8fafc);
  if (kind === 'gold') {
    // Cá vàng: thân tròn, vây bồng
    root.add(mkMesh(boxG, M(0xfb923c), [0.72, 0.62, 0.5], [0, 0, 0]));
    tailGroup.position.set(-0.34, 0, 0);
    tailGroup.add(mkMesh(boxG, finMat, [0.3, 0.5, 0.06], [-0.15, 0.02, 0]));
    root.add(tailGroup,
      mkMesh(boxG, finMat, [0.3, 0.26, 0.06], [-0.06, 0.38, 0]),
      mkMesh(boxG, finMat, [0.26, 0.2, 0.06], [-0.06, -0.36, 0]),
      mkMesh(boxG, eyeMat, [0.1, 0.1, 0.08], [0.28, 0.09, 0.2]),
      mkMesh(boxG, eyeMat, [0.1, 0.1, 0.08], [0.28, 0.09, -0.2]),
      mkMesh(boxG, shineMat, [0.035, 0.035, 0.02], [0.31, 0.12, 0.25]),
      mkMesh(boxG, shineMat, [0.035, 0.035, 0.02], [0.31, 0.12, -0.25]));
  } else if (kind === 'angel') {
    // Cá thần tiên: dáng đĩa, vây cao vút
    root.add(mkMesh(boxG, M(0xe2e8f0), [0.5, 0.86, 0.16], [0, 0, 0]),
             mkMesh(boxG, M(0x64748b), [0.1, 0.86, 0.17], [0.02, 0, 0]));
    tailGroup.position.set(-0.24, 0, 0);
    tailGroup.add(mkMesh(boxG, finMat, [0.26, 0.4, 0.05], [-0.13, 0, 0]));
    root.add(tailGroup,
      mkMesh(boxG, finMat, [0.2, 0.42, 0.05], [-0.02, 0.6, 0]),
      mkMesh(boxG, finMat, [0.16, 0.36, 0.05], [-0.02, -0.58, 0]),
      mkMesh(boxG, eyeMat, [0.075, 0.075, 0.06], [0.18, 0.12, 0.09]),
      mkMesh(boxG, eyeMat, [0.075, 0.075, 0.06], [0.18, 0.12, -0.09]));
  } else {
    // Cá bảy màu: thân thuôn, đuôi quạt
    root.add(mkMesh(boxG, M(0x38bdf8), [0.82, 0.4, 0.26], [0, 0, 0]),
             mkMesh(boxG, M(0x0ea5e9), [0.3, 0.34, 0.24], [0.32, 0.02, 0]));
    tailGroup.position.set(-0.4, 0, 0);
    tailGroup.add(mkMesh(boxG, finMat, [0.3, 0.44, 0.05], [-0.15, 0.02, 0]));
    root.add(tailGroup,
      mkMesh(boxG, finMat, [0.26, 0.18, 0.05], [-0.08, 0.24, 0]),
      mkMesh(boxG, eyeMat, [0.075, 0.075, 0.06], [0.4, 0.06, 0.14]),
      mkMesh(boxG, eyeMat, [0.075, 0.075, 0.06], [0.4, 0.06, -0.14]),
      mkMesh(boxG, shineMat, [0.03, 0.03, 0.02], [0.42, 0.08, 0.17]));
  }
  scene.add(root);
  return { root, tailGroup, kind, hue };
}
function toScreen(worldPos) {
  const v = new THREE.Vector3(worldPos.x, worldPos.y, worldPos.z); v.project(camera);
  const w = appEl.clientWidth, h = appEl.clientHeight;
  return { x: (v.x * 0.5 + 0.5) * w, y: (-v.y * 0.5 + 0.5) * h, visible: v.z < 1.0 && Math.abs(v.x) <= 1.15 && Math.abs(v.y) <= 1.15 };
}
function screenToWorldPlane(sx, sy, targetZ = 0) {
  const r = renderer.domElement.getBoundingClientRect();
  const ray = new THREE.Raycaster(); ray.setFromCamera(new THREE.Vector2(((sx) / r.width) * 2 - 1, -((sy) / r.height) * 2 + 1), camera);
  const pt = new THREE.Vector3(); ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 0, 1), -targetZ), pt);
  if (!pt.x && !pt.y && !pt.z) return { x: 0, y: 0, z: targetZ };
  pt.x = Math.max(-BOX_W * 0.43, Math.min(BOX_W * 0.43, pt.x));
  pt.y = Math.max(-BOX_H * 0.41, Math.min(BOX_H * 0.41, pt.y));
  pt.z = Math.max(-BOX_D * 0.38, Math.min(BOX_D * 0.38, pt.z));
  return pt;
}
function spawnFood(sx, sy) {
  const pt = screenToWorldPlane(sx, sy, (Math.random() - 0.5) * 1.2), fm = mkMesh(sphG, M(0xf97316), [0.12, 0.12, 0.12], [pt.x, pt.y, pt.z]);
  scene.add(fm);
  let best = null, bestD = Infinity;
  for (const f of gameState.fish) {
    if (!f.curPos) continue;
    const d = Math.hypot(f.curPos.x - pt.x, f.curPos.y - pt.y, f.curPos.z - pt.z);
    if (d < bestD) { bestD = d; best = f; }
  }
  if (best) { best.chase = { x: pt.x, y: pt.y, z: pt.z }; best.chaseAt = performance.now(); }
  foods.push({ mesh: fm, x: pt.x, y: pt.y, z: pt.z, eater: best });
}
function triggerFx(pos) {
  for (let i = 0; i < 5; i++) {
    const p = mkMesh(boxG, M(0xfde047), [0.05, 0.05, 0.05], [pos.x, pos.y, pos.z]); scene.add(p);
    fxList.push({ mesh: p, vx: (Math.random() - 0.5) * 1.6, vy: (Math.random() - 0.5) * 1.6, vz: (Math.random() - 0.5) * 1.6, life: 0.32 });
  }
}
function resize() {
  const w = appEl.clientWidth, h = appEl.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h;
  camera.position.z = camera.aspect < 0.6 ? (9.6 * (0.6 / camera.aspect)) : 9.6;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

let lastFrame = performance.now(), isTabVisible = !document.hidden;
document.addEventListener('visibilitychange', () => { isTabVisible = !document.hidden; if (isTabVisible) { lastFrame = performance.now(); requestAnimationFrame(animate); } });

function animate(now) {
  if (!isTabVisible) return;
  requestAnimationFrame(animate);
  const dt = Math.min(0.06, (now - lastFrame) / 1000); lastFrame = now;
  const camSway = Math.sin(now * 0.0005) * 0.3;
  camera.position.set(camSway, 0.2 + Math.cos(now * 0.0004) * 0.12, camera.position.z);
  camera.lookAt(camSway * 0.2, 0, 0);

  seaweeds.forEach(sw => sw.segs.forEach((sm, i) => sm.rotation.z = Math.sin(now * 0.002 + sw.offset + i * 0.7) * (0.06 * (i + 1))));
  waterTop.position.y = BOX_H / 2 - 0.05 + Math.sin(now * 0.002) * 0.03;
  bubbles.forEach(b => {
    b.mesh.position.y += b.spd * dt; b.mesh.position.x += Math.sin(now * 0.003 + b.seed) * 0.004;
    if (b.mesh.position.y > BOX_H / 2 - 0.2) { b.mesh.position.set((Math.random() - 0.5) * (BOX_W * 0.85), -BOX_H / 2 + 0.2, (Math.random() - 0.5) * (BOX_D * 0.75)); }
  });
  for (let i = fxList.length - 1; i >= 0; i--) {
    const fx = fxList[i]; fx.life -= dt; fx.mesh.position.x += fx.vx * dt; fx.mesh.position.y += fx.vy * dt; fx.mesh.position.z += fx.vz * dt;
    fx.mesh.scale.multiplyScalar(0.92); if (fx.life <= 0) { scene.remove(fx.mesh); fxList.splice(i, 1); }
  }
  for (let i = foods.length - 1; i >= 0; i--) {
    const fd = foods[i]; fd.y -= 1.35 * dt; fd.mesh.position.set(fd.x, fd.y, fd.z);
    if (fd.eater && fd.eater.chase) { fd.eater.chase.x = fd.x; fd.eater.chase.y = fd.y; fd.eater.chase.z = fd.z; }
    let eaten = false;
    for (const f of gameState.fish) {
      if (f.curPos && Math.hypot(f.curPos.x - fd.x, f.curPos.y - fd.y, f.curPos.z - fd.z) < 0.35 * (f.size || 1)) {
        triggerFx(fd); scene.remove(fd.mesh); foods.splice(i, 1); if (f.chase) f.chase = null; feedFish(f); eaten = true; break;
      }
    }
    if (!eaten && fd.y < -BOX_H / 2 + 0.2) { scene.remove(fd.mesh); foods.splice(i, 1); if (fd.eater) fd.eater.chase = null; }
  }

  const curIds = new Set(gameState.fish.map(f => f.id)), w = appEl.clientWidth, h = appEl.clientHeight;
  let fi = 0;
  for (const [id, item] of fishMeshes) { if (!curIds.has(id)) { scene.remove(item.root); item.labelEl.remove(); fishMeshes.delete(id); } }
  for (const f of gameState.fish) {
    const hue = CaLogic.hueOf(f.ownerId || 0), kind = f.kind || 'guppy';
    let item = fishMeshes.get(f.id);
    if (!item || item.kind !== kind || item.hue !== hue) {
      if (item) { scene.remove(item.root); item.labelEl.remove(); }
      const model = createFishModel(kind, hue), label = document.createElement('div');
      label.className = 'fish-tag-wrap'; labelContainer.appendChild(label);
      item = { ...model, labelEl: label }; fishMeshes.set(f.id, item);
    }
    const p = CaLogic.move(f, now, { w: 400, h: 700, d: 200 });
    const target = {
      x: f.overrideX != null ? ((f.overrideX / w) - 0.5) * (BOX_W * 0.72) : ((p.x / 400) - 0.5) * (BOX_W * 0.72),
      y: f.overrideY != null ? (0.5 - (f.overrideY / h)) * (BOX_H * 0.8) : (0.5 - (p.y / 700)) * (BOX_H * 0.8),
      z: ((p.z / 200) - 0.5) * (BOX_D * 0.7)
    };
    if (!f.curPos) f.curPos = { x: target.x, y: target.y, z: target.z };
    const goal = f.chase || target, spd = f.chase ? (3.2 / (f.size || 1)) : 1.4;
    f.curPos.x += (goal.x - f.curPos.x) * Math.min(1, dt * spd * 2.2);
    f.curPos.y += (goal.y - f.curPos.y) * Math.min(1, dt * spd * 2.2);
    f.curPos.z += (goal.z - f.curPos.z) * Math.min(1, dt * spd * 2.2);
    item.root.position.set(f.curPos.x, f.curPos.y, f.curPos.z);
    const sz = f.size || 1, sc = 0.62 + 0.34 * (sz - 1);   // cá to rõ nhưng không lọt qua kính
    item.root.scale.set(sc, sc, sc);
    const dx = goal.x - f.curPos.x, dy = goal.y - f.curPos.y, dz = goal.z - f.curPos.z;
    item.root.rotation.y = Math.atan2(-dz, dx);
    item.root.rotation.z = Math.atan2(dy, Math.hypot(dx, dz)) * 0.45;
    item.tailGroup.rotation.y = Math.sin(now * 0.009 * (1.2 / sz) + Number(f.id || 1)) * 0.45;
    const scr = toScreen({ x: f.curPos.x, y: f.curPos.y + sc * 0.5 + 0.2, z: f.curPos.z });
    f.screenX = scr.x; f.screenY = scr.y;
    if (scr.visible) {
      item.labelEl.style.display = 'flex';
      item.labelEl.style.left = (scr.x + ((fi % 3) - 1) * 7) + 'px'; item.labelEl.style.top = scr.y + 'px';
      item.labelEl.innerHTML = '<div class="fish-tag"><div class="fish-dot" style="background:hsl(' + hue +
        ',85%,62%)"></div>' + (f.name || 'Cá') + ' · ' + (f.owner || 'Ẩn danh') + '</div>';
    } else { item.labelEl.style.display = 'none'; }
    fi++;
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

/* ---------- Tương tác & Giao diện ---------- */
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (isGuestMode) { showToast('Mở trong Telegram để cùng nuôi'); return; }
  const r = renderer.domElement.getBoundingClientRect(); spawnFood(e.clientX - r.left, e.clientY - r.top);
});
async function feedFish(fish) {
  const now = Date.now();
  if (fish.fedAtLocal && now - fish.fedAtLocal < CaLogic.C.FISH_FEED_GAP) return;
  fish.fedAtLocal = now;
  const idData = window.GamesHub ? window.GamesHub.initData() : '';
  const res = await api('/fish/feed', { initData: idData, fishId: fish.id }); /* POST /fish/feed */
  if (res && res.ok) {
    fish.size = res.size; fish.fed = res.fed;
    if (res.yourFed != null) myKeeper.fed = res.yourFed;
    renderHud();
  } else if (res && res.why === 'too-fast') { showToast('Từ từ thôi bạn ơi!'); }
}
function flyCoinsToHud(sx, sy) {
  const coin = document.createElement('div'); coin.className = 'fly-coin';
  coin.style.left = sx + 'px'; coin.style.top = sy + 'px'; appEl.appendChild(coin);
  requestAnimationFrame(() => { coin.style.transform = 'translate(' + (35 - sx) + 'px,' + (25 - sy) + 'px) scale(0.6)'; coin.style.opacity = '0.3'; });
  setTimeout(() => coin.remove(), 650);
}
document.getElementById('btn-collect').onclick = async () => {
  if (isGuestMode) { showToast('Mở trong Telegram để cùng nuôi'); return; }
  const idData = window.GamesHub ? window.GamesHub.initData() : '';
  const res = await api('/fish/collect', { initData: idData }); /* POST /fish/collect */
  if (res && res.ok) {
    myKeeper.coins = res.coins; myKeeper.earned = (myKeeper.earned || 0) + (res.collected || 0);
    if (res.fish) gameState.fish = res.fish;
    showToast(res.collected > 0 ? ('Đã thu +' + res.collected + ' coin!') : 'Chưa có coin để thu');
    for (const f of gameState.fish) { if (String(f.ownerId) === String(myKeeper.id) && f.curPos) { const scr = toScreen(f.curPos); flyCoinsToHud(scr.x, scr.y); } }
    renderHud();
    if (window.GamesHub) { const lb = window.GamesHub.leaderboard('nuoi-ca'); lb.submit(myKeeper.earned); }
  } else { showToast('Chưa có coin để thu'); }
};
document.getElementById('btn-buy').onclick = () => {
  if (isGuestMode) { showToast('Mở trong Telegram để cùng nuôi'); return; }
  document.getElementById('buy-name').value = myKeeper.name ? (myKeeper.name.slice(0, 8) + ' con') : 'Cá con';
  document.getElementById('modal-buy').classList.remove('hidden');
};
document.querySelectorAll('.kind-card').forEach(el => {
  el.onclick = () => { document.querySelectorAll('.kind-card').forEach(c => c.classList.remove('active')); el.classList.add('active'); selectedKind = el.getAttribute('data-kind'); };
});
document.getElementById('btn-confirm-buy').onclick = async () => {
  const name = (document.getElementById('buy-name').value.trim() || '').slice(0, CaLogic.C.NAME_MAX);
  const myOwned = gameState.fish.filter(f => String(f.ownerId) === String(myKeeper.id)).length;
  if (!CaLogic.canBuy(myKeeper.coins, selectedKind, myOwned, gameState.fish.length)) {
    if (myKeeper.coins < CaLogic.priceOf(selectedKind)) showToast('Chưa đủ coin');
    else if (myOwned >= CaLogic.C.FISH_MAX_OWNED) showToast('Bạn đã có tối đa 8 con cá');
    else if (gameState.fish.length >= CaLogic.C.FISH_MAX_TANK) showToast('Ao đã đầy cá (tối đa 40 con)');
    return;
  }
  const idData = window.GamesHub ? window.GamesHub.initData() : '';
  const res = await api('/fish/buy', { initData: idData, kind: selectedKind, name: name }); /* POST /fish/buy */
  if (res && res.ok) {
    if (res.fish) gameState.fish.push(res.fish);
    myKeeper.coins = res.coins; myKeeper.fishes = (myKeeper.fishes || 0) + 1;
    document.getElementById('modal-buy').classList.add('hidden');
    showToast('Mua thành công cá ' + name + '!');
    renderHud();
  } else { showToast((res && res.why === 'poor') ? 'Chưa đủ coin' : 'Không mua được cá lúc này'); }
};
document.getElementById('btn-members').onclick = () => {
  const list = document.getElementById('member-list'), keepers = gameState.keepers || [];
  if (!keepers.length) { list.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:12px">Chưa có thành viên</div>'; }
  else {
    list.innerHTML = keepers.map(k => {
      const hue = CaLogic.hueOf(k.user_id || k.id);
      return '<div class="member-item"><div class="member-dot" style="background:hsl(' + hue + ',85%,60%)"></div><div class="member-name">' + (k.name || 'Người nuôi') + '</div><div class="member-stat"><div>' + (k.fishes || 0) + ' cá</div><div style="color:#eab308">' + (k.coins || 0) + ' coin</div></div></div>';
    }).join('');
  }
  document.getElementById('modal-members').classList.remove('hidden');
};
document.getElementById('btn-lb').onclick = () => {
  const c = document.getElementById('lb-content');
  if (window.GamesHub && window.GamesHub.renderLeaderboard) { window.GamesHub.renderLeaderboard(c, 'nuoi-ca'); }
  document.getElementById('modal-lb').classList.remove('hidden');
};
document.querySelectorAll('[data-close]').forEach(b => {
  b.onclick = () => document.getElementById(b.getAttribute('data-close')).classList.add('hidden');
});
joinAo();
setInterval(fetchLive, 2500);

/* ---------- Debug Hook ---------- */
if (location.search.includes('debug=1')) {
  window.CaDebug = {
    state() { return gameState; },
    fish() {
      return (gameState.fish || []).map(f => {
        const scr = f.curPos ? toScreen(f.curPos) : { x: 0, y: 0 };
        return {
          id: f.id, name: f.name, owner: f.owner, kind: f.kind, size: f.size,
          x: f.overrideX != null ? f.overrideX : scr.x,
          y: f.overrideY != null ? f.overrideY : scr.y,
          z: f.curPos ? f.curPos.z : 0,
          pay: CaLogic.pay(f, Date.now())
        };
      });
    },
    spawnAt(kind, x, y) {
      const pt = screenToWorldPlane(x, y, 0);
      const f = {
        id: 'dbg_' + (++dbgSeq), ownerId: myKeeper.id || 1, owner: myKeeper.name || 'Debug',
        kind: kind || 'guppy', name: 'DebugFish', size: 1.0, fed: 0, bornAt: Date.now(), lastPay: Date.now(),
        overrideX: x, overrideY: y, curPos: { x: pt.x, y: pt.y, z: pt.z }
      };
      gameState.fish.push(f);
      return f;
    },
    feedAt(x, y) { spawnFood(x, y); },
    setGuest(bool) { isGuestMode = Boolean(bool); updateGuestBanner(); }
  };
}
